[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RAILWAY_URL.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
