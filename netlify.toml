# ⚠️ TEMPORARY SETUP — Netlify Functions as API backend
# When you move to Railway/Render, replace the /api/* redirects below with:
#   [[redirects]]
#     from = "/api/*"
#     to = "https://YOUR_RAILWAY_OR_RENDER_URL/api/:splat"
#     status = 200
#     force = true
# ...and DELETE the netlify/functions/ folder entirely.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ⚠️ TEMPORARY — route API calls to Netlify Functions (delete when using Railway/Render)
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/dashboard/*"
  to = "/.netlify/functions/dashboard/:splat"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
