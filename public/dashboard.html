        renderIncomePage(
          payroll || [],
          revenue || { days: {}, weekTotal: 0 },
          tips || [],
          settings || {}
        );
        await buildCategorySelector('now-rev-cat');
        await buildCategorySelector('any-rev-cat');
      } catch (e) {
        showToast(e.message, 'error');
        renderErrorInline("loadPage('income')");
      }
    }

    function changeIncomeWeek(days) {
      const d = parseDate(currentIncomeWeek);
      d.setDate(d.getDate() + days);
      const next = formatDate(d);
      if (days > 0 && next > getCurrentWeekStart()) return;
      currentIncomeWeek = next;
      loadIncomePage();
    }

    function renderDailyRevenueGrid(revenue) {
      const days = revenue.days || {};
      const dayOrder = Object.keys(days).sort();
      const dayLabel = dateStr => {
        const d = parseDate(dateStr);
        return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d.getDay() === 0 ? 6 : d.getDay() - 1];
      };
      const dayDate = dateStr => {
        const d = parseDate(dateStr);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}`;
      };

      const grid = dayOrder.map(date => {
        const day = days[date];
        const entries = (day.entries || []).map(e => `
          <div class="revenue-entry">
            <span class="category-dot" style="background:${categoryColor(e.category)}" title="${categoryLabel(e.category)}"></span>
            <span class="entry-amount">$${Number(e.amount).toFixed(2)}</span>
            <span class="entry-note">${escapeHtml(e.note || categoryLabel(e.category))}</span>
            <button class="entry-delete" onclick="deleteDailyRevenue(${e.id})" aria-label="Delete">✕</button>
          </div>`).join('');
        return `
          <div class="revenue-day">
            <div class="day-label">${dayLabel(date)}</div>
            <div class="day-date">${dayDate(date)}</div>
            <div class="day-total">$${Number(day.total).toFixed(2)}</div>
            <div class="day-entries">${entries || '<div style="font-size:11px;color:var(--text-muted)">No entries</div>'}</div>
          </div>`;
      }).join('');

      return `
        <div class="card" style="padding:20px;margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0;font-size:16px;font-weight:700;color:var(--text)">Daily Revenue</h3>
            <div class="week-total">Total: <strong>$${Number(revenue.weekTotal || 0).toFixed(2)}</strong></div>
          </div>
          <div class="revenue-grid">${grid}</div>
        </div>`;
    }

    function renderIncomePage(payroll, revenue, tips, settings) {
      const today = formatDate(new Date());
      const weekEnd = formatDate(new Date(parseDate(currentIncomeWeek).getTime() + 6 * 86400000));
      const thisWeek = getCurrentWeekStart();
      const atCurrent = currentIncomeWeek >= thisWeek;

      const totalLabor = payroll.reduce((s, r) => s + (r.total_gross_pay || 0), 0);
      const weekRevenue = Number(revenue.weekTotal || 0);
      const weekTipsRows = (tips || []).filter(t => t.shift_date >= currentIncomeWeek && t.shift_date <= weekEnd);
      const weekTipsTotal = weekTipsRows.reduce((s, t) => s + Number(t.total_tips || 0), 0);
      const tipsCount = weekTipsRows.length;
      const revenueEntries = Object.values(revenue.days || {}).reduce((n, d) => n + ((d.entries || []).length), 0);

      const laborPctNum = weekRevenue > 0 ? (totalLabor / weekRevenue) * 100 : null;
      const laborPctText = laborPctNum === null ? 'N/A' : `${laborPctNum.toFixed(1)}%`;
      const laborPctColor = laborPctNum === null ? 'var(--text-muted)'
        : laborPctNum < 30 ? 'var(--success)'
        : laborPctNum <= 40 ? 'var(--accent)'
        : 'var(--color-danger)';
      const laborPctSub = laborPctNum === null ? 'Log revenue to calculate' : 'of revenue';

      const net = weekRevenue - totalLabor;
      const netColor = weekRevenue === 0 ? 'var(--text)'
        : net >= 0 ? 'var(--success)' : 'var(--color-danger)';

      const tipsRows = (tips || []).map(t => {
        const d = parseDate(t.shift_date);
        const fmt = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' +
          ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
        return `<tr>
          <td>${fmt}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(Number(t.total_tips || 0))}</td>
          <td style="color:var(--text-muted);font-size:12px">${escapeHtml(t.split_method || 'pool')}</td>
        </tr>`;
      }).join('');

      const showSummary = weekRevenue > 0;
      const pct = v => Math.max(0, Math.min(100, weekRevenue > 0 ? (v / weekRevenue) * 100 : 0));

      const summaryHtml = !showSummary ? '' : `
        <div class="card" style="margin-top:20px;padding:20px">
          <h3 style="margin:0 0 12px;font-size:16px;font-weight:700;color:var(--text)">This week at a glance</h3>
          <div class="summary-bar-wrap">
            <div class="summary-bar-label">Revenue</div>
            <div class="summary-bar-track"><div class="summary-bar-fill" style="width:100%;background:var(--accent)"></div></div>
            <div class="summary-bar-amount">${formatCurrency(weekRevenue)}</div>
          </div>
          <div class="summary-bar-wrap">
            <div class="summary-bar-label">Labor</div>
            <div class="summary-bar-track"><div class="summary-bar-fill" style="width:${pct(totalLabor)}%;background:#D97706"></div></div>
            <div class="summary-bar-amount">${formatCurrency(totalLabor)}</div>
          </div>
          <div class="summary-bar-wrap">
            <div class="summary-bar-label">Tips</div>
            <div class="summary-bar-track"><div class="summary-bar-fill" style="width:${pct(weekTipsTotal)}%;background:var(--success)"></div></div>
            <div class="summary-bar-amount">${formatCurrency(weekTipsTotal)}</div>
          </div>
          <div class="summary-bar-wrap" style="border-bottom:none">
            <div class="summary-bar-label">Net</div>
            <div class="summary-bar-track"></div>
            <div class="summary-bar-amount" style="color:${netColor}">${formatCurrency(net)}</div>
          </div>
        </div>`;

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Income</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-small" onclick="changeIncomeWeek(-7)">&larr; Prev</button>
            <span style="font-size:14px;font-weight:600;color:var(--text-secondary)">Week of ${formatWeekRange(currentIncomeWeek)}</span>
            <button class="btn-small" onclick="changeIncomeWeek(7)" ${atCurrent ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>Next &rarr;</button>
          </div>
        </div>

        <div class="stat-grid" style="margin-bottom:20px;grid-template-columns:repeat(4,1fr)">
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value">${formatCurrency(weekRevenue)}</div>
            <div class="stat-sub">${revenueEntries} ${revenueEntries === 1 ? 'entry' : 'entries'} this week</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Total Tips</div>
            <div class="stat-value">${formatCurrency(weekTipsTotal)}</div>
            <div class="stat-sub">${tipsCount} tip ${tipsCount === 1 ? 'record' : 'records'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Labor %</div>
            <div class="stat-value" style="color:${laborPctColor}">${laborPctText}</div>
            <div class="stat-sub">${laborPctSub}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Net</div>
            <div class="stat-value" style="color:${netColor}">${formatCurrency(net)}</div>
            <div class="stat-sub">after labor costs</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:20px;padding:20px">
          <h3 style="margin:0 0 12px;font-size:16px;font-weight:700;color:var(--text)">Log revenue</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">For right now <span style="font-weight:400;text-transform:none">(${today})</span></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <div class="cat-wrap"><select id="now-rev-cat" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit"></select></div>
                <input id="now-rev-amount" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;min-width:100px;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
                <button class="btn-primary" onclick="addRevenueNow()">Add now</button>
              </div>
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">For a specific date</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <input id="any-rev-date" type="date" value="${today}" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit">
                <div class="cat-wrap"><select id="any-rev-cat" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit"></select></div>
                <input id="any-rev-amount" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;min-width:100px;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
                <button class="btn-primary" onclick="addRevenueAnyDate()">Add</button>
              </div>
            </div>
          </div>
        </div>

        ${renderDailyRevenueGrid(revenue)}
        ${renderRevenueChartOnly(revenue)}

        <div class="card" style="margin-top:20px;padding:20px">
          <h3 style="margin:0 0 12px;font-size:16px;font-weight:700;color:var(--text)">Tips</h3>
          <div style="margin-bottom:16px">
            <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Add tips for today</div>
            <div style="display:flex;gap:8px">
              <input id="quick-tips" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
              <button class="btn-primary" onclick="quickAddTips()">Add Tips</button>
            </div>
          </div>
          <table class="data-table">
            <thead><tr><th>Date</th><th style="text-align:right">Amount</th><th>Notes</th></tr></thead>
            <tbody>${tipsRows || renderEmptyRow(3, '💸', 'No tips logged yet', 'Add tips above as your team earns them — history will appear here.')}</tbody>
          </table>
        </div>

        ${summaryHtml}
      `);
    }

    async function _submitRevenue(date, amount, category, amtEl) {
      if (!date) { showToast('Pick a date', 'error'); return; }
      if (!Number.isFinite(amount) || amount <= 0) { showToast('Enter an amount greater than zero', 'error'); return; }
      try {
        await api('/api/revenue/daily', 'POST', { date, amount, category: category || null });
        if (amtEl) amtEl.value = '';
        await (currentPage === 'income' ? loadIncomePage() : loadPayrollPage());
        const label = category ? ` (${category})` : '';
        showToast(`$${amount.toFixed(2)}${label} added for ${date}`);
      } catch (e) {
        const msg = /does not exist|column.*does not exist/i.test(e.message || '')
          ? 'daily_revenue table/columns missing — run the migration SQL in Supabase'
          : (e.message || 'Failed to add revenue');
        showToast(msg, 'error');
      }
    }

    async function addRevenueNow() {
      const amtEl = document.getElementById('now-rev-amount');
      const catEl = document.getElementById('now-rev-cat');
      const category = (catEl && catEl.closest('.cat-wrap')?.offsetParent !== null) ? catEl.value || null : null;
      const amount = parseFloat(amtEl?.value);
      const date = formatDate(new Date());
      return _submitRevenue(date, amount, category, amtEl);
    }

    async function addRevenueAnyDate() {
      const amtEl = document.getElementById('any-rev-amount');
      const date = document.getElementById('any-rev-date')?.value;
      const catEl = document.getElementById('any-rev-cat');
      const category = (catEl && catEl.closest('.cat-wrap')?.offsetParent !== null) ? catEl.value || null : null;
      const amount = parseFloat(amtEl?.value);
      return _submitRevenue(date, amount, category, amtEl);
    }

    // Legacy — called by the old daily-grid path. Kept so any in-flight
    // rendering doesn't error; the new grid no longer uses it.
    async function addDailyRevenue(date) {
      const amtEl = document.getElementById(`rev-${date}`);
      const catEl = document.getElementById(`cat-${date}`);
      const amount = parseFloat(amtEl?.value);
      const category = catEl?.value || 'other';
      return _submitRevenue(date, amount, category, amtEl);
    }

    async function quickAddTips() {
      const el = document.getElementById('quick-tips');
      const totalTips = parseFloat(el?.value);
      if (!Number.isFinite(totalTips) || totalTips <= 0) { showToast('Enter an amount greater than zero', 'error'); return; }
      const shiftDate = formatDate(new Date());
      try {
        await api('/api/tips', 'POST', { shiftDate, totalTips });
        if (el) el.value = '';
        await (currentPage === 'income' ? loadIncomePage() : loadPayrollPage());
        showToast(`$${totalTips.toFixed(2)} tips added for today`);
      } catch (e) { showToast(e.message || 'Failed to add tips', 'error'); }
    }

    function renderRevenueChartOnly(revenue) {
      const days = revenue.days || {};
      const dayOrder = Object.keys(days).sort();
      const totals = dayOrder.map(d => Number(days[d].total || 0));
      const maxAmount = Math.max(...totals, 1);

      const dayLabel = dateStr => {
        const d = parseDate(dateStr);
        return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d.getDay() === 0 ? 6 : d.getDay() - 1];
      };

      // Stacked bar chart — each day's total split into colored segments by category
      const bars = dayOrder.map(date => {
        const dayTotal = Number(days[date].total);
        const pct = (dayTotal / maxAmount) * 100;
        const byCat = days[date].byCategory || {};
        const segments = Object.keys(byCat)
          .filter(c => (byCat[c] || 0) > 0)
          .map(c => {
            const catPct = dayTotal > 0 ? (byCat[c] / dayTotal) * 100 : 0;
            return `<div class="bar-segment" style="height:${catPct}%;background:${categoryColor(c)}" title="${escapeHtml(categoryLabel(c))}: $${byCat[c].toFixed(2)}"></div>`;
          }).join('');
        return `
          <div class="chart-col">
            <div class="bar-container">
              <div class="bar-fill" style="height:${pct}%;background:transparent;display:flex;flex-direction:column-reverse" title="$${dayTotal.toFixed(2)}">${segments}</div>
            </div>
            <div class="bar-label">${dayLabel(date)}</div>
            <div class="bar-amount">$${dayTotal.toFixed(0)}</div>
          </div>
        `;
      }).join('');

      const usedCats = new Set();
      for (const d of Object.values(days)) for (const c of Object.keys(d.byCategory || {})) usedCats.add(c);
      const legend = Array.from(usedCats).map(c => `
        <span class="legend-item">
          <span class="category-dot" style="background:${categoryColor(c)}"></span>
          ${escapeHtml(categoryLabel(c))}
        </span>
      `).join('') || '<span style="color:var(--text-muted);font-size:12px">No entries this week yet</span>';

      return `
        <div class="card" style="margin-top:20px;padding:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0;font-size:16px;color:var(--text)">Week Revenue</h3>
            <div class="week-total">Total: <strong>$${Number(revenue.weekTotal || 0).toFixed(2)}</strong></div>
          </div>
          <div class="chart-legend">${legend}</div>
          <div class="chart-bars">${bars}</div>
        </div>
      `;
    }

    // Dead code from the old 7-column grid — kept shallow so any stale
    // reference via bfcache / browser-back resolves safely. Not used.
    function renderRevenueSection(revenue) { return renderRevenueChartOnly(revenue); }

        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}`;
      };

      const grid = dayOrder.map(date => {
        const day = days[date];
        const entries = (day.entries || []).map(e => `

            <div class="add-entry">

              <input type="number" class="revenue-input" placeholder="0.00" min="0" step="0.01" id="rev-${date}">
              <input type="text" class="note-input" placeholder="note" id="note-${date}" maxlength="80">
              <button class="add-btn" onclick="addDailyRevenue('${date}')">+ Add</button>

      // Stacked bar chart — each day's total split into colored segments by category

      const legend = Array.from(usedCats).map(c => `

        <div class="revenue-section">

          </div>
          <div class="revenue-grid">${grid}</div>
          <div class="revenue-chart">
            <div class="chart-legend">${legend}</div>
            <div class="chart-bars">${bars}</div>
          </div>
        </div>
      `;
    }

    async function addDailyRevenue(date) {
      const amtEl = document.getElementById(`rev-${date}`);
      const noteEl = document.getElementById(`note-${date}`);
      const catEl = document.getElementById(`cat-${date}`);
      const amount = parseFloat(amtEl?.value);
      const category = catEl?.value || 'other';
      if (!Number.isFinite(amount) || amount <= 0) {
        showToast('Enter an amount greater than zero', 'error');
        return;
      }
      try {
        await api('/api/revenue/daily', 'POST', { date, amount, category, note: noteEl?.value || undefined });
        await loadPayrollPage();
        showToast(`$${amount.toFixed(2)} ${categoryLabel(category)} added`);
      } catch (e) { showToast(e.message, 'error'); }
    }

    async function deleteDailyRevenue(id) {
      showModal('Delete revenue entry?', `<p style="color:var(--text-secondary)">This can't be undone.</p>`, async () => {
        try {
          await api(`/api/revenue/daily/${id}`, 'DELETE');
          await (currentPage === 'income' ? loadIncomePage() : loadPayrollPage());
          showToast('Entry removed');
        } catch (e) { showToast(e.message, 'error'); }
      }, 'Delete');
    }

    function editPayrollRowFromBtn(btn) {
      const staffId = Number(btn.dataset.staffId);
      const name = btn.dataset.name || '';
      const hours = Number(btn.dataset.hours) || 0;
      const pay = Number(btn.dataset.pay) || 0;
      editPayrollRow(staffId, name, hours, pay);
    }

    function editPayrollRow(staffId, name, hours, pay) {
      const weekStart = currentPayrollWeek;
      showModal(`Edit payroll — ${name}`, `
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Week of ${formatWeekRange(weekStart)}</div>
        <label>Hours</label>
        <input type="number" id="ed-hours" min="0" step="0.1" value="${hours.toFixed(2)}" />
        <label>Gross Pay ($)</label>
        <input type="number" id="ed-pay" min="0" step="0.01" value="${pay.toFixed(2)}" />
      `, async () => {
        const newHours = parseFloat(document.getElementById('ed-hours').value);
        const newPay = parseFloat(document.getElementById('ed-pay').value);
        if (!Number.isFinite(newHours) || newHours < 0) {
          showToast('Hours must be a non-negative number', 'error');
          return;
        }
        if (!Number.isFinite(newPay) || newPay < 0) {
          showToast('Gross pay must be a non-negative number', 'error');
          return;
        }
        try {
          await api('/api/payroll/override', 'PATCH', {
            staffId, weekStart,
            totalHours: newHours, totalGrossPay: newPay,
          });
          await loadPayrollPage();
          showToast(`${name}: payroll updated`);
        } catch (e) {
          showToast(e.message || 'Failed to save', 'error');
        }
      }, 'Save');
    }

    function changePayrollWeek(days) {
      const d = parseDate(currentPayrollWeek);
      d.setDate(d.getDate() + days);
      const next = formatDate(d);
      // Don't allow navigating past the current week (future planning not meaningful for payroll history)
      if (days > 0 && next > getCurrentWeekStart()) return;
      currentPayrollWeek = next;
      loadPayrollPage();
    }

    async function logTips() {

    // ── PAGE: TIME CLOCK ──

    async function loadTimeClockPage() {
      try {
        const data = await api(`/api/timeclock/weekly?weekStart=${currentScheduleWeek}`);
        renderTimeClockPage(data || { rows: [] });
      } catch (e) {
        console.error('loadTimeClockPage failed:', e);
        showToast(e.message || 'Failed to load time clock', 'error');
        renderErrorInline("loadPage('timeclock')");
      }
    }

    function renderTimeClockPage(data) {
      const rows = data.rows || [];
      const missedRows = rows.filter(r => r.missedClockOuts > 0);

      const alert = missedRows.length > 0 ? `
        <div class="alert-banner orange">
          <div class="alert-row"><strong>⚠️ ${missedRows.length} possible missed clock-out${missedRows.length === 1 ? '' : 's'}</strong></div>
          ${missedRows.map(r => `
            <div class="alert-row">
              <span>${escapeHtml(r.staffName)} — ${r.missedClockOuts} open entr${r.missedClockOuts === 1 ? 'y' : 'ies'}</span>
              <button class="alert-action" onclick="clockOutNow(${r.staffId})">Clock out now</button>
            </div>
          `).join('')}
        </div>
      ` : '';

      const statusBadge = r => {
        if (r.missedClockOuts > 0) return '<span class="badge red">Missing clock-out</span>';
        if (r.variance > 4) return '<span class="badge orange">Possible overtime</span>';
        if (r.variance < -4) return '<span class="badge grey">Under scheduled</span>';
        return '<span class="badge green">Normal</span>';
      };

      const rowClass = r => r.missedClockOuts > 0 ? 'row-warning' : '';
      const varianceClass = r => r.variance > 0 ? 'text-success' : (r.variance < -2 ? 'text-warning' : '');

      const rowsHtml = rows.map(r => {
        const hSched = Number(r.hoursScheduled || 0);
        const hClock = Number(r.hoursClocked || 0);
        const varH = Number(r.variance || 0);
        return `
        <tr class="expandable ${rowClass(r)}" onclick="document.getElementById('entries-${r.staffId}').classList.toggle('hidden')">
          <td>${escapeHtml(r.staffName || '')}</td>
          <td>${escapeHtml(r.role || '')}</td>
          <td>${r.shiftsScheduled || 0}</td>
          <td>${hSched.toFixed(1)}h</td>
          <td>${hClock.toFixed(1)}h</td>
          <td class="${varianceClass({ variance: varH })}">${varH >= 0 ? '+' : ''}${varH.toFixed(1)}h</td>
          <td>${statusBadge(r)}</td>
        </tr>
        <tr class="clock-entries-row hidden" id="entries-${r.staffId}">
          <td colspan="7">
            ${(r.entries || []).map(e => {
              const ci = e.clockIn ? new Date(e.clockIn) : null;
              const co = e.clockOut ? new Date(e.clockOut) : null;
              const eh = Number(e.hours || 0);
              return `
              <div class="clock-entry">
                <span>${ci ? ci.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '—'}</span>
                <span>In: ${ci ? ci.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—'}</span>
                <span>Out: ${co ? co.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '<span style="color:var(--color-accent)">⚠️ Missing</span>'}</span>
                <span>${eh.toFixed(1)}h</span>
                ${!co ? `<button class="alert-action" onclick="event.stopPropagation(); clockOutNow(${r.staffId})">Clock Out</button>` : ''}
              </div>`;
            }).join('') || '<div style="color:var(--text-muted);font-size:12px">No clock entries this week</div>'}
            <button class="alert-action" style="margin-top:8px" onclick="event.stopPropagation(); addManualEntry(${r.staffId}, '${escapeJs(r.staffName || '')}')">+ Add Manual Entry</button>
          </td>
        </tr>`;
      }).join('');

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Time Clock</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-small" onclick="changeScheduleWeek(-7)">&larr; Prev</button>
            <span style="font-size:14px;font-weight:600;color:var(--text-secondary)">Week of ${formatWeekRange(currentScheduleWeek)}</span>
            <button class="btn-small" onclick="changeScheduleWeek(7)">Next &rarr;</button>
          </div>
        </div>
        ${alert}
        <div class="card">
          <table class="timeclock-table">
            <thead>
              <tr>
                <th>Staff</th><th>Role</th><th>Shifts</th>
                <th>Scheduled</th><th>Clocked</th><th>Variance</th><th>Status</th>
              </tr>
            </thead>
            <tbody>${rowsHtml || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px">No staff this week</td></tr>'}</tbody>
          </table>
        </div>
      `);
    }

    async function clockOutNow(staffId) {
      try {
        await api('/api/timeclock/override', 'POST', { staffId, action: 'clock_out' });
        await loadTimeClockPage();
        showToast('Clocked out');
      } catch (e) { showToast(e.message, 'error'); }
    }

    function addManualEntry(staffId, staffName) {
      const todayStr = formatDate(new Date());
      showModal(`Add clock entry — ${staffName}`, `
        <label>Date</label><input type="date" id="manual-date" value="${todayStr}" />
        <label>Clock In</label><input type="time" id="manual-in" />
        <label>Clock Out (optional)</label><input type="time" id="manual-out" />
      `, async () => {
        const date = document.getElementById('manual-date').value;
        const clockIn = document.getElementById('manual-in').value;
        const clockOut = document.getElementById('manual-out').value;
        if (!date || !clockIn) { showToast('Date and Clock In are required', 'error'); return; }
        try {
          // Use ISO timestamp combining date+time for 'adjust' override
          const clockInIso = new Date(`${date}T${clockIn}`).toISOString();
          await api('/api/timeclock/override', 'POST', {
            staffId, action: 'clock_in', time: clockInIso,
          });
          if (clockOut) {
            const clockOutIso = new Date(`${date}T${clockOut}`).toISOString();
            await api('/api/timeclock/override', 'POST', {
              staffId, action: 'adjust', time: clockOutIso,
            });
          }
          await loadTimeClockPage();
          showToast('Entry added');
        } catch (e) { showToast(e.message, 'error'); }
      }, 'Add');
    }

    // ───────────────────────────────────────────

    // ───────────────────────────────────────────
    let currentEventFilter = 'all';
    let cachedEvents = [];

    async function loadEventLogPage() {
      try {
        const data = await api(`/api/events?weekStart=${currentScheduleWeek}`);
        cachedEvents = data?.events || [];
        renderEventLogPage();
      } catch (e) {
        showToast(e.message, 'error');
        renderErrorInline("loadPage('eventlog')");

    function renderEventLogPage() {
      const filtered = currentEventFilter === 'all'
        ? cachedEvents
        : cachedEvents.filter(e => e.eventType === currentEventFilter);

      const tabs = ['all', 'coverage', 'trade', 'overtime']
        .map(t => `<button class="filter-tab ${t === currentEventFilter ? 'active' : ''}" onclick="filterEvents('${t}')">${t[0].toUpperCase() + t.slice(1)}</button>`)
        .join('');

      const cards = filtered.length === 0 ? `
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <h3>No events this week</h3>
          <p>Coverage requests, trades, and overtime events will appear here.</p>
        </div>
      ` : filtered.map(renderEventCard).join('');

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Event Log</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-small" onclick="changeScheduleWeek(-7)">&larr; Prev</button>
            <span style="font-size:14px;font-weight:600;color:var(--text-secondary)">Week of ${formatWeekRange(currentScheduleWeek)}</span>
            <button class="btn-small" onclick="changeScheduleWeek(7)">Next &rarr;</button>
          </div>
        </div>
        <div class="filter-tabs">${tabs}</div>
        ${cards}
      `);
    }

    function renderEventCard(e) {
      const when = new Date(e.timestamp).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' });
      if (e.eventType === 'coverage') {
        const badge = e.meta.status === 'covered'
          ? `<span class="badge green">Filled${e.meta.fillMinutes != null ? ` in ${e.meta.fillMinutes} min` : ''}</span>`
          : e.meta.status === 'cancelled' ? '<span class="badge grey">Cancelled</span>' : '<span class="badge red">Unfilled</span>';
        const meta = e.meta.status === 'covered' ? `Covered by ${escapeHtml(e.meta.coveredBy || 'someone')}` : '';
        return `
          <div class="event-card coverage">
            <div class="event-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 16.92z"/></svg></div>
            <div class="event-body">
              <div class="event-title">${escapeHtml(e.title)}</div>
              <div class="event-meta">${meta} ${badge}</div>
              <div class="event-time">${when}</div>
            </div>
          </div>`;
      }
      if (e.eventType === 'trade') {
        const badge = e.meta.status === 'completed' ? '<span class="badge green">Completed</span>'
                   : e.meta.status === 'cancelled' ? '<span class="badge grey">Cancelled</span>'
                   : '<span class="badge orange">Open</span>';
        const arrow = e.meta.to ? ` → ${escapeHtml(e.meta.to)}` : '';
        return `
          <div class="event-card trade">
            <div class="event-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
            <div class="event-body">
              <div class="event-title">${escapeHtml(e.title)}</div>
              <div class="event-meta">${escapeHtml(e.meta.from || '')}${arrow} ${badge}</div>
              <div class="event-time">${when}</div>
            </div>
          </div>`;
      }
      // overtime
      return `
        <div class="event-card overtime">
          <div class="event-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
          <div class="event-body">
            <div class="event-title">${escapeHtml(e.title)}</div>
            <div class="event-meta">${e.meta.totalHours.toFixed(1)}hrs total — ${e.meta.overtimeHours.toFixed(1)}hrs overtime ($${e.meta.grossPay.toFixed(2)})</div>
            <div class="event-time">Week of ${String(e.timestamp).slice(0,10)}</div>
          </div>
        </div>`;
    }

    function filterEvents(type) {
      currentEventFilter = type;
      renderEventLogPage();
    }

      const section = document.getElementById('revenue-types-section');
      if (!section) return;
      let types = [];
      try { types = await api('/api/revenue/types'); } catch (e) { types = []; }
      const listHtml = types.length === 0

        : types.map(t => `

    function showAddRevenueType() {
      document.getElementById('add-type-inline').style.display = 'block';
      document.getElementById('new-type-input').focus();
    }

    function hideAddRevenueType() {
      document.getElementById('add-type-inline').style.display = 'none';
      document.getElementById('new-type-input').value = '';
    }

    async function submitNewRevenueType() {
      const name = document.getElementById('new-type-input').value.trim();
      if (!name) { showToast('Enter a category name', 'error'); return; }
      try {
        await api('/api/revenue/types', 'POST', { name });
        invalidateRevenueTypesCache();
        await renderRevenueTypesSettings();
        showToast(`"${name}" added`);
      } catch (err) { showToast(err.message || 'Failed to add', 'error'); }
    }

    async function deleteRevenueType(id) {
      try {
        await api(`/api/revenue/types/${id}`, 'DELETE');
        invalidateRevenueTypesCache();
        await renderRevenueTypesSettings();
        showToast('Category removed');
      } catch (err) { showToast('Failed to remove', 'error'); }
    }

    async function toggleTimeclockEnabled() {
      const toggle = document.getElementById('timeclock-toggle');
      if (!toggle) return;
      const isCurrentlyOn = toggle.classList.contains('on');
      try {
        await api('/api/settings', 'PATCH', { timeclockEnabled: !isCurrentlyOn });
        toggle.classList.toggle('on');
        showToast(isCurrentlyOn ? 'Time clock disabled' : 'Time clock enabled');
      } catch (e) {
        showToast(e.message || 'Failed to update', 'error');
      }
    }

    async function toggleNavPage(pageId) {
      const toggle = document.getElementById(`nav-toggle-${pageId}`);
      if (!toggle) return;
      const isCurrentlyOn = toggle.classList.contains('on');
      try {
        const settings = await api('/api/settings');
        const hidden = Array.isArray(settings.hiddenPages) ? settings.hiddenPages : [];
        const newHidden = isCurrentlyOn
          ? Array.from(new Set([...hidden, pageId]))
          : hidden.filter(p => p !== pageId);
        await api('/api/settings', 'PATCH', { hiddenPages: newHidden });
        toggle.classList.toggle('on');
        await applyNavPreferences();
        showToast(isCurrentlyOn ? `${pageId} hidden` : `${pageId} shown in nav`);
      } catch (e) {
        showToast(e.message || 'Failed to update', 'error');
      }
    }

        const rows = list.map((r, i) => `

      }

        if (wrap) wrap.innerHTML = reqsHtml();

        `<label>Name</label><input id="m-sname" value="${escapeHtml(shift.name)}" />

            });
            // Save role requirements (replaces existing)
            const cleaned = (window.__editingReqs || [])
              .map(r => ({ role: String(r.role || '').trim(), count: parseInt(r.count) || 0 }))
              .filter(r => r.role && r.count > 0);

    // Convert "11:00 AM" / "8:00 PM" to "HH:MM" for <input type="time"> compatibility
    function _toHHMM(t) {
      if (!t) return '';
      const m = String(t).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
      if (!m) return String(t);
      let h = parseInt(m[1]);
      const mm = m[2] || '00';
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h !== 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      return `${String(h).padStart(2,'0')}:${mm}`;
    }

    async function openSearch() {
      const overlay = document.getElementById('search-overlay');
      overlay.classList.remove('hidden');
      const input = document.getElementById('search-input');
      input.value = '';
      input.focus();
      renderSearchResults('');

    function closeSearch() {
      document.getElementById('search-overlay')?.classList.add('hidden');
    }
    function invalidateStaffSearchCache() { _staffSearchCache = null; }

    function renderSearchResults(query) {
      const q = query.toLowerCase().trim();
      const container = document.getElementById('search-results');
      if (!container) return;

      if (!q) {
        const items = SEARCH_INDEX.filter(i => i.type === 'page').slice(0, 5);
        _searchResults = items;
        container.innerHTML = `
          <div class="search-results-header">Quick access</div>
          ${items.map((it, i) => renderSearchItem(it, i)).join('')}`;
        return;
      }

      const staticResults = SEARCH_INDEX.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.keywords.some(k => k.toLowerCase().includes(q))
      );

      const staffResults = (_staffSearchCache || [])
        .filter(s => (s.name || '').toLowerCase().includes(q) || (s.role || '').toLowerCase().includes(q))
        .slice(0, 4)
        .map(s => ({
          type: 'staff', title: s.name, sub: s.role || 'Staff',
          icon: '👤', staffId: s.id, page: 'staff',
        }));

      const all = [...staffResults, ...staticResults].slice(0, 10);
      _searchResults = all;

      if (!all.length) {
        container.innerHTML = `<div class="search-empty">No results for &ldquo;${escapeHtml(query)}&rdquo;</div>`;
        return;
      }
      container.innerHTML = all.map((it, i) => renderSearchItem(it, i)).join('');
    }

    function renderSearchItem(item, idx) {
      const sub = item.sub || (item.type === 'page' ? 'Page' : item.type === 'settings' ? 'Settings section' : '');
      return `
        <div class="search-result-item" onclick="executeSearchByIdx(${idx})">
          <div class="search-result-icon">${item.icon || '•'}</div>
          <div>
            <div class="search-result-title">${escapeHtml(item.title)}</div>
            ${sub ? `<div class="search-result-sub">${escapeHtml(sub)}</div>` : ''}
          </div>
        </div>`;
    }

    function executeSearchByIdx(idx) {
      const item = _searchResults[idx];
      if (!item) return;
      closeSearch();
      navigateTo(item.page);
      if (item.anchor) {
        setTimeout(() => {
          document.getElementById(item.anchor)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 350);
      }
      if (item.staffId) {
        setTimeout(() => {
          const row = document.querySelector(`[data-staff-id="${item.staffId}"]`);
          if (row) {
            row.style.background = 'var(--color-accent-dim)';
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => row.style.background = '', 2000);
          }
        }, 500);
      }
    }

    // ── Keyboard shortcuts ──
    const KEY_MAP = {
      'g+o': () => navigateTo('overview'),
      'g+s': () => navigateTo('schedule'),
      'g+t': () => navigateTo('staff'),
      'g+p': () => navigateTo('payroll'),
      'g+i': () => navigateTo('income'),
      'g+e': () => navigateTo('eventlog'),
      'g+c': () => navigateTo('settings'),
    };
    let _keyBuffer = '';
    let _keyTimer = null;

    document.addEventListener('keydown', e => {
      // Always allow Escape to close search/modal
      if (e.key === 'Escape') {
        closeSearch();
        return;
      }
      // Skip when user is typing
      const tag = e.target?.tagName;
      const inField = ['INPUT','TEXTAREA','SELECT'].includes(tag) || e.target?.isContentEditable;
      if (inField) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (e.key === '/') { e.preventDefault(); openSearch(); return; }
      if (e.key === '?') { e.preventDefault(); showShortcutsModal(); return; }

      // g+letter combos
      const lower = e.key.toLowerCase();
      if (lower.length !== 1) return;
      _keyBuffer = (_keyBuffer + lower).slice(-3);
      clearTimeout(_keyTimer);
      _keyTimer = setTimeout(() => { _keyBuffer = ''; }, 600);

      const combo = _keyBuffer.length >= 2
        ? `${_keyBuffer[_keyBuffer.length - 2]}+${_keyBuffer[_keyBuffer.length - 1]}`
        : null;
      if (combo && KEY_MAP[combo]) {
        KEY_MAP[combo]();
        _keyBuffer = '';
      }
    });

    function showShortcutsModal() {
      const shortcuts = [
        ['/',         'Open search'],
        ['G then O',  'Overview'],
        ['G then S',  'Schedule'],
        ['G then T',  'Staff (Team)'],
        ['G then P',  'Payroll'],
        ['G then I',  'Income'],
        ['G then E',  'Event Log'],
        ['G then C',  'Settings (Config)'],
        ['?',         'Show this help'],
        ['Esc',       'Close modal / search'],
      ];
      // Build modal manually so it has no Confirm button
      const existing = document.getElementById('modal-backdrop');
      if (existing) existing.remove();
      const m = document.createElement('div');
      m.id = 'modal-backdrop';
      m.innerHTML = `
        <div class="modal-card">
          <div class="modal-title">Keyboard Shortcuts</div>
          <div class="modal-body">
            <div class="shortcuts-grid">
              ${shortcuts.map(([key, desc]) => `
                <div class="shortcut-row">
                  <div class="shortcut-keys">
                    ${key.split(' then ').map(k => `<kbd class="kbd">${k}</kbd>`).join('<span class="shortcut-then">then</span>')}
                  </div>
                  <div class="shortcut-desc">${desc}</div>
                </div>`).join('')}
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-primary" onclick="document.getElementById('modal-backdrop').remove()">Got it</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', esc); }
      });
    }

    // ── Init ──
    (async function init() {
      // Restore dark-mode preference from localStorage
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
      }

      // Set week label
      document.getElementById('week-label').textContent = 'Week of ' + formatWeekRange(getCurrentWeekStart());

      // Overlay click closes sidebar
      document.getElementById('sidebar-overlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('visible');
      });

      // Check auth
      await checkAuth();

      // Apply nav visibility preferences
      await applyNavPreferences();

      // Route from hash
      const hash = window.location.hash.replace('#', '');
      if (hash && PAGE_TITLES[hash]) {
        navigateTo(hash);
      } else {
        navigateTo('overview');
      }
      markUpdated();

      // Auto-refresh every 5 minutes
      refreshInterval = setInterval(() => {
        loadPage(currentPage);
      }, 5 * 60 * 1000);
    })();

    // Handle hash changes
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && PAGE_TITLES[hash] && hash !== currentPage) {
        navigateTo(hash);
      }
    });
  </script>
</body>
</html>
