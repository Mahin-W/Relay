    <main class="main-content">
      <header class="top-bar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2 id="page-title">Overview</h2>
        </div>
        <div class="top-bar-right">
          <span class="week-label" id="week-label"></span>
          <span class="last-updated" id="last-updated-text" title="Last data refresh"></span>
          <button class="search-trigger" onclick="openSearch()" title="Search (press /)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <kbd class="kbd" style="padding:0 4px;font-size:11px">/</kbd>
          </button>
          <button class="refresh-btn" id="refresh-btn" onclick="handleRefresh()" title="Refresh data">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </header>

      <div class="content-area" id="page-content"></div>
    </main>
  </div>

  <script>
    // ── State ──
    let currentPage = 'overview';
    let currentScheduleWeek = getCurrentWeekStart();
    let scheduleStatus = null;
    let _dragState = null;
    let _lastAction = null;
    let dashboardData = {};
    let refreshInterval = null;

    const PAGE_TITLES = {
      overview: 'Overview',
      schedule: 'Schedule',
      staff: 'Staff',
      payroll: 'Payroll',
      income: 'Income',
      timeclock: 'Time Clock',
      eventlog: 'Event Log',
      settings: 'Settings'
    };

    // ── Helpers ──
    function getCurrentWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      return formatDate(monday);
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatWeekRange(weekStartStr) {
      const start = parseDate(weekStartStr);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const startMonth = months[start.getMonth()];
      const endMonth = months[end.getMonth()];
      if (startMonth === endMonth) {
        return `${startMonth} ${start.getDate()} \u2013 ${end.getDate()}`;
      }
      return `${startMonth} ${start.getDate()} \u2013 ${endMonth} ${end.getDate()}`;
    }

    function relativeTime(timestamp) {
      if (!timestamp) return '';
      const now = Date.now();
      const then = new Date(timestamp).getTime();
      const diff = now - then;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) return 'just now';
      if (minutes < 60) return `${minutes}min ago`;
      if (hours < 24) return `${hours}hr ago`;
      if (days === 1) return 'Yesterday';
      if (days < 7) return `${days} days ago`;
      return new Date(timestamp).toLocaleDateString();
    }

    function shiftPillClass(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('lunch')) return 'lunch';
      if (n.includes('dinner')) return 'dinner';
      if (n.includes('brunch')) return 'brunch';
      return 'other';
    }

    function eventDotClass(type) {
      switch (type) {
        case 'callout': return 'dot-orange';
        case 'coverage_filled': return 'dot-green';
        case 'late': return 'dot-yellow';
        case 'recognition': return 'dot-blue';
        default: return 'dot-gray';
      }
    }

    function insightDotClass(type) {
      switch (type) {
        case 'good': return 'dot-green';
        case 'warning': return 'dot-orange';
        default: return 'dot-gray';
      }
    }

    function formatCurrency(n) {
      return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    // ── API ──
    async function apiFetch(url) {
      const res = await fetch(url, { credentials: 'include' });
      if (res.status === 401) {
        window.location.href = '/login';
        throw new Error('Unauthorized');
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, credentials: 'include', headers: {} };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      if (res.status === 401) {
        window.location.href = '/login';
        return null;
      }
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ── Toast ──
    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    function formatRelativeTime(isoStr) {
      if (!isoStr) return '';
      const then = new Date(isoStr).getTime();
      if (!Number.isFinite(then)) return '';
      const diffSec = Math.floor((Date.now() - then) / 1000);
      if (diffSec < 60) return 'just now';
      if (diffSec < 3600) {
        const m = Math.floor(diffSec / 60);
        return `${m} minute${m === 1 ? '' : 's'} ago`;
      }
      if (diffSec < 86400) {
        const h = Math.floor(diffSec / 3600);
        return `${h} hour${h === 1 ? '' : 's'} ago`;
      }
      if (diffSec < 86400 * 7) {
        const d = Math.floor(diffSec / 86400);
        return `${d} day${d === 1 ? '' : 's'} ago`;
      }
      const dt = new Date(isoStr);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[dt.getMonth()]} ${dt.getDate()}`;
    }

    function showConfirmModal(title, message, confirmText = 'Confirm', cancelText = 'Cancel') {
      return new Promise(resolve => {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal-card">
            <div class="modal-title">${title}</div>
            <div class="modal-body"><p style="color:var(--color-text-secondary);font-size:14px;line-height:1.6;margin:0">${message}</p></div>
            <div class="modal-actions">
              <button class="btn-secondary" data-act="cancel">${cancelText}</button>
              <button class="btn-small btn-danger" data-act="confirm" style="padding:10px 20px;font-size:14px;border-radius:8px">${confirmText}</button>
            </div>
          </div>
        `;
        document.body.appendChild(backdrop);
        const cleanup = (val) => { backdrop.remove(); resolve(val); };
        backdrop.querySelector('[data-act="confirm"]').onclick = () => cleanup(true);
        backdrop.querySelector('[data-act="cancel"]').onclick  = () => cleanup(false);
        backdrop.addEventListener('click', e => { if (e.target === backdrop) cleanup(false); });
      });
    }

    // ── Modal ──
    function showModal(title, bodyHTML, onConfirm, confirmLabel = 'Confirm') {
      const existing = document.getElementById('modal-backdrop');
      if (existing) existing.remove();
      const m = document.createElement('div');
      m.id = 'modal-backdrop';
      m.innerHTML = `
        <div class="modal-card">
          <h3 class="modal-title"></h3>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="document.getElementById('modal-backdrop').remove()">Cancel</button>
            <button class="btn-primary" id="modal-confirm">${confirmLabel}</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      document.querySelector('#modal-backdrop .modal-title').textContent = title;
      document.getElementById('modal-confirm').onclick = () => { m.remove(); onConfirm(); };
      m.addEventListener('click', e => { if (e.target === m) m.remove(); });
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', esc); }
      });
    }

    // ── Content helper ──
    function setContent(html) {
      const main = document.getElementById('page-content');
      if (main) main.innerHTML = html;
    }

    function showSkeleton() {
      setContent('<div style="text-align:center;padding:60px;color:var(--color-text-muted)">Loading...</div>');
    }

    function renderErrorInline(retryFnStr) {
      setContent(`
        <div class="error-state">
          <p>Failed to load data</p>
          <button class="retry-btn" onclick="${retryFnStr}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Tap to retry
          </button>
        </div>
      `);
    }

    // ── Auth ──
    async function checkAuth() {
      try {
        const data = await apiFetch('/api/auth/me');
        document.getElementById('restaurant-name').textContent = data.restaurantName || 'My Business';
        window._groupId = data.groupId || null;
      } catch {
        // redirect handled in apiFetch
      }
    }

    // ── Avatars ──
    const AVATAR_COLORS = [
      ['#FDF0E8', '#B84D20'],
      ['#E6F4ED', '#1A5C3E'],
      ['#EDE9FE', '#5B21B6'],
      ['#E0F2FE', '#075985'],
      ['#FEF3C7', '#92400E'],
      ['#FCE7F3', '#9D174D'],
    ];
    function getAvatarColor(name) {
      const s = String(name || '');
      let hash = 0;
      for (let i = 0; i < s.length; i++) {
        hash = s.charCodeAt(i) + ((hash << 5) - hash);
      }
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }
    function renderAvatar(name, size = 32) {
      const initials = String(name || '').trim().split(/\s+/)
        .map(n => n[0] || '').join('').substring(0, 2).toUpperCase() || '?';
      const [bg, text] = getAvatarColor(name);
      return `<div class="staff-avatar" style="width:${size}px;height:${size}px;background:${bg};color:${text};font-size:${Math.floor(size * 0.38)}px">${initials}</div>`;
    }

    // ── Save success animation ──
    function showSaveSuccess(buttonEl) {
      if (!buttonEl) return;
      const original = buttonEl.innerHTML;
      const originalBg = buttonEl.style.background;
      buttonEl.innerHTML = '✓ Saved';
      buttonEl.style.background = 'var(--color-success)';
      buttonEl.style.color = '#fff';
      buttonEl.disabled = true;
      setTimeout(() => {
        buttonEl.innerHTML = original;
        buttonEl.style.background = originalBg;
        buttonEl.style.color = '';
        buttonEl.disabled = false;
      }, 1800);
    }

    // ── Section loader ──
    function showSectionLoader(containerId) {
      const el = document.getElementById(containerId);
      if (!el || document.getElementById(`${containerId}-loader`)) return;
      if (getComputedStyle(el).position === 'static') {
        el.style.position = 'relative';
      }
      const overlay = document.createElement('div');
      overlay.className = 'section-loader';
      overlay.id = `${containerId}-loader`;
      overlay.innerHTML = '<div class="section-spinner"></div>';
      el.appendChild(overlay);
    }
    function hideSectionLoader(containerId) {
      document.getElementById(`${containerId}-loader`)?.remove();
    }

    // ── Empty state with CTA ──
    // ctaFn is a string (e.g., "navigateTo('staff')") — NOT serialized closure.
    function renderEmptyState(icon, title, desc, ctaLabel, ctaFn) {
      return `
        <div class="empty-state empty-state-cta">
          <div class="empty-icon">${icon}</div>
          <div class="empty-title">${escapeHtml(title)}</div>
          <div class="empty-desc">${escapeHtml(desc)}</div>
          ${ctaLabel ? `<button class="btn-primary" onclick="${ctaFn}">${escapeHtml(ctaLabel)}</button>` : ''}
        </div>`;
    }
    function renderEmptyRow(colspan, icon, title, desc, ctaLabel, ctaFn) {
      return `<tr><td colspan="${colspan}" style="padding:0">${renderEmptyState(icon, title, desc, ctaLabel, ctaFn)}</td></tr>`;
    }

    // ── Inline staff name editing ──
    document.addEventListener('click', e => {
      const el = e.target.closest('.staff-name[data-editable]');
      if (!el || el.querySelector('input')) return;
      const staffId = el.dataset.staffId;
      const field = el.dataset.field || 'name';
      const original = el.textContent.trim();
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'inline-edit-input';
      input.value = original;
      input.style.width = Math.max(original.length * 9, 80) + 'px';
      el.textContent = '';
      el.appendChild(input);
      input.focus(); input.select();

      let cancelled = false;
      async function save() {
        if (cancelled) return;
        const val = input.value.trim();
        if (!val || val === original) { el.textContent = original; return; }
        try {
          await api(`/api/staff/${staffId}`, 'PATCH', { [field]: val });
          el.textContent = val;
          invalidateStaffSearchCache();
          showToast(`Updated ${original} → ${val}`);
        } catch (err) {
          el.textContent = original;
          showToast('Failed to save', 'error');
        }
      }
      input.addEventListener('blur', save, { once: true });
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') input.blur();
        if (ev.key === 'Escape') {
          cancelled = true;
          input.removeEventListener('blur', save);
          el.textContent = original;
        }
      });
    });

    // ── Mobile swipe navigation ──
    const PAGE_ORDER_FOR_SWIPE = ['overview', 'schedule', 'staff', 'payroll', 'income', 'eventlog', 'settings'];
    let _touchStartX = 0;
    let _touchStartY = 0;
    let _touchStartScrollable = false;

    function isInsideScrollable(el) {
      // Walk up; if any ancestor has overflow-x scroll/auto AND content overflows, treat as scrollable
      let n = el;
      while (n && n !== document.body) {
        const cs = getComputedStyle(n);
        const ovX = cs.overflowX;
        if ((ovX === 'auto' || ovX === 'scroll') && n.scrollWidth > n.clientWidth) return true;
        if (n.classList && (n.classList.contains('schedule-scroll') || n.classList.contains('search-overlay'))) return true;
        n = n.parentElement;
      }
      return false;
    }
    document.addEventListener('touchstart', e => {
      _touchStartX = e.touches[0].clientX;
      _touchStartY = e.touches[0].clientY;
      _touchStartScrollable = isInsideScrollable(e.target);
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (_touchStartScrollable) return;
      const dx = e.changedTouches[0].clientX - _touchStartX;
      const dy = e.changedTouches[0].clientY - _touchStartY;
      if (Math.abs(dx) < 70) return;
      if (Math.abs(dy) > Math.abs(dx) * 0.7) return;
      const idx = PAGE_ORDER_FOR_SWIPE.indexOf(currentPage);
      if (idx === -1) return;
      if (dx < 0 && idx < PAGE_ORDER_FOR_SWIPE.length - 1) navigateTo(PAGE_ORDER_FOR_SWIPE[idx + 1]);
      else if (dx > 0 && idx > 0) navigateTo(PAGE_ORDER_FOR_SWIPE[idx - 1]);
    }, { passive: true });

    // ── Last-updated relative time ──
    let _lastUpdated = new Date();
    function markUpdated() {
      _lastUpdated = new Date();
      updateLastUpdatedText();
    }
    function updateLastUpdatedText() {
      const el = document.getElementById('last-updated-text');
      if (!el) return;
      const diff = Math.floor((Date.now() - _lastUpdated.getTime()) / 1000);
      if (diff < 60) el.textContent = 'Just updated';
      else if (diff < 3600) el.textContent = `${Math.floor(diff / 60)}m ago`;
      else el.textContent = `${Math.floor(diff / 3600)}h ago`;
    }
    setInterval(updateLastUpdatedText, 60000);

    async function applyNavPreferences() {
      try {
        const s = await api('/api/settings');
        const hidden = Array.isArray(s?.hiddenPages) ? s.hiddenPages : [];
        document.querySelectorAll('.nav-item[data-page]').forEach(el => {
          const page = el.dataset.page;
          el.style.display = hidden.includes(page) ? 'none' : '';
        });
      } catch {
        // fail silently — show all nav items
      }
    }

    async function handleLogout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
      } catch {}
      window.location.href = '/login';
    }

    // ── Data Loading ──
    async function loadOverviewData() {
      const [overview, activity, insights, schedule, staffList, shiftsList, rolesList] = await Promise.all([
        apiFetch('/api/dashboard/overview'),
        apiFetch('/api/dashboard/activity'),
        apiFetch('/api/dashboard/intelligence'),
        apiFetch('/api/dashboard/schedule?week=' + currentScheduleWeek),
        api('/api/staff').catch(() => []),
        api('/api/shifts').catch(() => []),
        api('/api/roles').catch(() => []),
      ]);
      const onboarding = {
        staffCount:  (staffList || []).length,
        shiftsCount: (shiftsList || []).length,
        hasRates:    (rolesList || []).some(r => r.rate != null && r.rate > 0),
        shiftsThisWeek: overview?.shiftsThisWeek || 0,
      };
      dashboardData = { overview, activity, insights, schedule, onboarding };
      return dashboardData;
    }

    async function loadScheduleData(week) {
      const schedule = await apiFetch('/api/dashboard/schedule?week=' + week);
      dashboardData.schedule = schedule;
      return schedule;
    }

    // ── Skeleton Renderers ──
    function renderOverviewSkeleton() {
      return `
        <div class="stat-grid">
          ${[1,2,3,4].map(() => `
            <div class="stat-card">
              <div class="skeleton" style="height:10px;width:100px;margin-bottom:12px"></div>
              <div class="skeleton skeleton-stat"></div>
              <div class="skeleton" style="height:10px;width:60px;margin-top:10px"></div>
            </div>
          `).join('')}
        </div>
        <div class="card schedule-wrapper compact" style="margin-bottom:24px">
          <div class="card-header">This Week's Schedule</div>
          <div class="card-body">
            ${[1,2,3,4].map(() => '<div class="skeleton skeleton-row"></div>').join('')}
          </div>
        </div>
        <div class="panels-grid">
          <div class="card">
            <div class="card-header">Recent Activity</div>
            <div class="card-body">
              ${[1,2,3].map(() => '<div class="skeleton skeleton-line"></div>').join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-header">Relay's Insights</div>
            <div class="card-body">
              ${[1,2,3].map(() => '<div class="skeleton skeleton-line"></div>').join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderScheduleSkeleton() {
      return `
        <div class="card">
          <div class="schedule-nav">
            <button class="schedule-nav-btn" disabled>&larr; Prev</button>
            <span class="schedule-nav-label">Loading...</span>
            <button class="schedule-nav-btn" disabled>Next &rarr;</button>
          </div>
          <div class="card-body">
            ${[1,2,3,4,5].map(() => '<div class="skeleton skeleton-row"></div>').join('')}
          </div>
        </div>
      `;
    }

    // ── Error Renderer ──
    function renderError(retryFn) {
      return `
        <div class="error-state">
          <p>Failed to load data</p>
          <button class="retry-btn" onclick="${retryFn}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Tap to retry
          </button>
        </div>
      `;
    }

    // ── Page Renderers ──
    function renderDelta(current, previous, suffix = '') {
      if (previous == null) return '';
      const diff = current - previous;
      if (diff === 0) return `<span class="stat-delta neutral">— same as last week</span>`;
      const arrow = diff > 0 ? '↑' : '↓';
      const cls   = diff > 0 ? 'positive' : 'negative';
      return `<span class="stat-delta ${cls}">${arrow} ${Math.abs(diff)}${suffix} vs last week</span>`;
    }

    function renderStatCards(data) {
      const d = data || {};
      const coverageSub = d.coverageRequests > 0
        ? `<span class="stat-sub orange">Avg ${d.avgFillMinutes != null ? d.avgFillMinutes : '?'}min to fill</span>`
        : `<span class="stat-sub green">&#10003; None this week</span>`;
      const laborSub = d.revenuePercent
        ? `<span class="stat-sub ${d.revenuePercent > 30 ? 'orange' : 'green'}">${d.revenuePercent}% of revenue</span>`
        : `<span class="stat-sub orange">Enter revenue for %</span>`;
      const shiftsDelta = renderDelta(d.shiftsThisWeek ?? 0, d.lastWeek?.shiftsCount);

      return `
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Staff Scheduled</div>
            <div class="stat-value">${d.staffCount ?? '—'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Shifts This Week</div>
            <div class="stat-value">${d.shiftsThisWeek ?? '—'}</div>
            ${shiftsDelta}
          </div>
          <div class="stat-card">
            <div class="stat-label">Coverage Requests</div>
            <div class="stat-value">${d.coverageRequests ?? '0'}</div>
            ${coverageSub}
          </div>
          <div class="stat-card">
            <div class="stat-label">Labor Cost</div>
            <div class="stat-value">${d.laborCost != null ? formatCurrency(d.laborCost) : '—'}</div>
            ${laborSub}
          </div>
        </div>
      `;
    }

    // ── Shift-centric schedule layout ──
    const _DAY_ORDER = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const _DAY_INDEX = Object.fromEntries(_DAY_ORDER.map((d, i) => [d, i]));

    function formatShiftTime(t) {
      if (!t) return '';
      const [h, m] = String(t).split(':').map(Number);
      if (!Number.isFinite(h)) return String(t);
      const ampm = h >= 12 ? 'pm' : 'am';
      const h12 = h % 12 || 12;
      return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2, '0')}${ampm}`;
    }

    function dateForDay(weekStart, dayName) {
      const idx = _DAY_INDEX[dayName];
      if (idx == null) return '';
      const d = parseDate(weekStart);
      d.setDate(d.getDate() + idx);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[d.getMonth()]} ${d.getDate()}`;
    }

    // Returns: [{ shift: {id,name,day_of_week,start_time,end_time}, staff: [{staffId,staffName,roleName}], hours }]
    // Sorted by Mon-Sun then start_time. Shifts with no assignments are still included.
    function buildShiftCentricRows(schedule, shifts) {
      const byShiftId = new Map();
      (shifts || []).forEach(s => {
        byShiftId.set(s.id, { shift: s, staff: [], hours: shiftHoursOf(s) });
      });
      const keyToId = {};
      (shifts || []).forEach(s => {
        if (s && s.day_of_week && s.name && s.id != null) keyToId[`${s.day_of_week}|${s.name}`] = s.id;
      });
      (schedule?.staff || []).forEach(member => {
        const staffEntry = {
          staffId: member.staffId ?? member.id,
          staffName: member.staffName || member.name || '',
          roleName: member.roleName || member.role || '',
        };
        Object.entries(member.shifts || {}).forEach(([day, list]) => {
          (list || []).forEach(s => {
            const name = typeof s === 'string' ? s : (s.shiftName || s.name || '');
            const sid = keyToId[`${day}|${name}`];
            if (sid != null && byShiftId.has(sid)) {
              byShiftId.get(sid).staff.push(staffEntry);
            }
          });
        });
      });
      const rows = Array.from(byShiftId.values());
      rows.sort((a, b) => {
        const da = _DAY_INDEX[a.shift.day_of_week] ?? 99;
        const db = _DAY_INDEX[b.shift.day_of_week] ?? 99;
        if (da !== db) return da - db;
        return String(a.shift.start_time || '').localeCompare(String(b.shift.start_time || ''));
      });
      return rows;
    }

    function renderShiftCentricSchedule(schedule, shifts, settings, isCurrentWeek) {
      const rows = buildShiftCentricRows(schedule, shifts);
      if (rows.length === 0) {
        return `<div class="card" style="padding:0">${renderEmptyState('📅', 'No shifts configured', 'Add some shifts in Settings → Shifts, then assign staff.', 'Open Settings', "navigateTo('settings')")}</div>`;
      }
      const weekStart = (schedule && schedule.weekStart) || currentScheduleWeek;
      const editable = !!isCurrentWeek;

      // Group by day
      const byDay = new Map();
      _DAY_ORDER.forEach(d => byDay.set(d, []));
      rows.forEach(r => {
        const d = r.shift.day_of_week || 'Other';
        if (!byDay.has(d)) byDay.set(d, []);
        byDay.get(d).push(r);
      });

      const groupsHtml = _DAY_ORDER
        .filter(day => (byDay.get(day) || []).length > 0)
        .map(day => {
          const date = dateForDay(weekStart, day);
          const shiftHtml = byDay.get(day).map(row => renderShiftRow(row, weekStart, editable)).join('');
          return `
            <div class="shifts-day-group">
              <div class="day-header">${day}<span class="day-header-date">${date}</span></div>
              ${shiftHtml}
            </div>`;
        }).join('');

      return groupsHtml;
    }

    function renderShiftRow(row, weekStart, editable) {
      const s = row.shift;
      const time = `${formatShiftTime(s.start_time)} – ${formatShiftTime(s.end_time)}`;
      const assignedIds = row.staff.map(st => st.staffId);
      const pillsHtml = row.staff.map(st => renderStaffPill(st, s.id, weekStart, editable)).join('');
      const addBtn = editable
        ? `<button class="add-staff-btn" onclick="openAddStaffToShift(${s.id}, ${JSON.stringify(s.name)}, ${JSON.stringify(assignedIds)})">+ Add</button>`
        : '';
      const dropAttrs = editable ? `
        ondragover="onShiftRowDragOver(event)"
        ondragleave="onShiftRowDragLeave(event)"
        ondrop="onShiftRowDrop(event)"
      ` : '';
      const empty = (!row.staff.length && !editable)
        ? '<span class="shift-row-empty">No one assigned</span>'
        : '';
      return `
        <div class="shift-row" data-shift-id="${s.id}">
          <div class="shift-row-header">
            <div class="shift-row-name">${escapeHtml(s.name || 'Shift')}</div>
            <div class="shift-row-time">${time}</div>
          </div>
          <div class="shift-row-staff" data-shift-id="${s.id}" ${dropAttrs}>
            ${pillsHtml}
            ${empty}
            ${addBtn}
          </div>
        </div>`;
    }

    function renderStaffPill(staffEntry, shiftId, weekStart, editable) {
      const name = staffEntry.staffName || '';
      const dragAttrs = editable ? `
        draggable="true"
        data-staff-id="${staffEntry.staffId}"
        data-from-shift-id="${shiftId}"
        data-week-start="${weekStart}"
        ondragstart="onStaffPillDragStart(event)"
        ondragend="onStaffPillDragEnd(event)"
      ` : '';
      const removeBtn = editable
        ? `<span class="pill-remove" onclick="removeStaffFromShift(event, ${staffEntry.staffId}, ${shiftId})" title="Remove">×</span>`
        : '';
      return `
        <span class="staff-pill" ${dragAttrs}>
          ${renderAvatar(name, 22)}
          <span>${escapeHtml(name)}</span>
          ${removeBtn}
        </span>`;
    }

    function buildShiftMap(shifts) {
      // (day_of_week + '|' + shiftName) → shift_id
      const map = {};
      (shifts || []).forEach(s => {
        if (s && s.day_of_week && s.name && s.id != null) {
          map[`${s.day_of_week}|${s.name}`] = s.id;
        }
      });
      return map;
    }

    function shiftHoursOf(s) {
      if (!s || !s.start_time || !s.end_time) return 0;
      const [sh, sm] = String(s.start_time).split(':').map(Number);
      const [eh, em] = String(s.end_time).split(':').map(Number);
      let h = (eh * 60 + em - sh * 60 - sm) / 60;
      if (h < 0) h += 24;
      return h;
    }

    function renderScheduleTable(schedule, compact, shifts = [], settings = {}, isCurrentWeek = false) {
      const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const DAY_FULL = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
      const staff = schedule?.staff || [];
      const showHours = !compact;
      const editable = !compact && isCurrentWeek;

      const shiftMap = buildShiftMap(shifts);
      const shiftHoursById = {};
      (shifts || []).forEach(s => { shiftHoursById[s.id] = shiftHoursOf(s); });
      const otThreshold = Number(settings?.overtimeThreshold) || 40;

      let html = `<div class="card schedule-wrapper${compact ? ' compact' : ''}">`;

      if (!compact) {
        const atCurrent = currentScheduleWeek === getCurrentWeekStart();
        html += `
          <div class="schedule-nav">
            <button class="schedule-nav-btn" onclick="changeScheduleWeek(-7)">&larr; Prev</button>
            <span class="schedule-nav-label">Week of ${formatWeekRange(currentScheduleWeek)}</span>
            <button class="schedule-nav-btn" onclick="changeScheduleWeek(7)" ${atCurrent ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}>Next &rarr;</button>
          </div>
        `;
      } else {
        html += `<div class="card-header">This Week's Schedule</div>`;
      }

      html += `<div class="schedule-scroll"><table class="schedule-table"><thead><tr>
        <th>Staff</th>`;
      days.forEach(d => { html += `<th>${d}</th>`; });
      if (showHours) html += `<th style="text-align:right">Total</th>`;
      html += `</tr></thead><tbody>`;

      if (staff.length === 0) {
        html += `<tr><td colspan="${showHours ? 9 : 8}" style="text-align:center;padding:24px;color:var(--text-muted)">No schedule data</td></tr>`;
      }

      staff.forEach(member => {
        const staffId = member.staffId ?? member.id ?? '';
        let totalHours = 0;
        const memberName = member.staffName || member.name || '';
        let rowHtml = `<tr data-staff-id="${staffId}"><td>
          <div style="display:flex;align-items:center;gap:8px">
            ${compact ? '' : renderAvatar(memberName, 26)}
            <div>
              <div class="staff-name">${escapeHtml(memberName)}</div>
              ${(member.roleName || member.role) ? `<div class="staff-role">${escapeHtml(member.roleName || member.role)}</div>` : ''}
            </div>
          </div>
        </td>`;

        days.forEach(day => {
          const dayKey = DAY_FULL[day];
          const shiftsList = member.shifts?.[dayKey] || member.shifts?.[day.toLowerCase()] || member.shifts?.[day] || [];
          let cellHtml = '';
          if (Array.isArray(shiftsList)) {
            shiftsList.forEach(s => {
              const label = typeof s === 'string' ? s : (s.shiftName || s.name || '');
              const sid = shiftMap[`${dayKey}|${label}`] ?? null;
              if (sid != null) totalHours += (shiftHoursById[sid] || 0);
              const dragAttrs = (editable && sid != null) ? `
                draggable="true"
                data-staff-id="${staffId}"
                data-shift-id="${sid}"
                data-day="${dayKey}"
                data-shift-name="${escapeHtml(label)}"
                data-week-start="${currentScheduleWeek}"
                ondragstart="onPillDragStart(event)"
                ondragend="onPillDragEnd(event)"
              ` : '';
              const removeBtn = (editable && sid != null) ? `<span class="pill-remove" onclick="removeAssignment(event, '${staffId}', '${sid}')">×</span>` : '';
              cellHtml += `<div class="shift-pill ${shiftPillClass(label)} ${editable && sid != null ? 'draggable-pill' : ''}" ${dragAttrs}>${escapeHtml(label)}${removeBtn}</div>`;
            });
          }
          const cellAttrs = editable ? `
            class="schedule-cell droppable"
            data-staff-id="${staffId}"
            data-day="${dayKey}"
            ondragover="onCellDragOver(event)"
            ondragleave="onCellDragLeave(event)"
            ondrop="onCellDrop(event)"
          ` : 'class="schedule-cell"';
          rowHtml += `<td ${cellAttrs}>${cellHtml}</td>`;
        });

        if (showHours) {
          // Prefer computed totalHours (from shiftMap lookup); fall back to member.totalHours from API
          const hrs = totalHours > 0 ? totalHours : Number(member.totalHours || 0);
          const hoursColor = hrs >= otThreshold
            ? 'var(--color-danger)'
            : hrs >= otThreshold * 0.9
              ? 'var(--color-warning)' : 'var(--text-muted)';
          rowHtml += `<td style="text-align:right">
            <span style="font-weight:600;color:${hoursColor}">${hrs.toFixed(1)}h</span>
            ${hrs >= otThreshold ? '<span class="ot-badge">OT</span>' : ''}
          </td>`;
        }
        rowHtml += `</tr>`;
        html += rowHtml;
      });

      html += `</tbody></table></div></div>`;
      return html;
    }

    function renderActivity(events) {
      if (!events || events.length === 0) {
        return `<div class="empty-state">No recent activity</div>`;
      }
      let html = '<ul class="event-list">';
      events.forEach(e => {
        html += `
          <li class="event-item">
            <span class="event-dot ${eventDotClass(e.type)}"></span>
            <span class="event-text">${escapeHtml(e.text || e.message || '')}</span>
            <span class="event-time">${relativeTime(e.timestamp || e.created_at)}</span>
          </li>`;
      });
      html += '</ul>';
      return html;
    }

    function renderInsights(insights) {
      if (!insights || insights.length === 0) {
        return `<div class="empty-state green">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2D7D5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div>Everything looks good this week</div>
        </div>`;
      }
      let html = '<ul class="insight-list">';
      insights.forEach(i => {
        html += `
          <li class="insight-item">
            <span class="insight-dot ${insightDotClass(i.type || i.level)}"></span>
            <span class="insight-text">${escapeHtml(i.text || i.message || '')}</span>
          </li>`;
      });
      html += '</ul>';
      return html;
    }

    function renderOverview(data) {
      const { overview, activity, insights, schedule, onboarding } = data;
      const onboardingHtml = renderOnboardingChecklist(onboarding);
      const quickActionsHtml = renderQuickActions(overview, schedule);
      let html = onboardingHtml;
      html += renderStatCards(overview);
      html += quickActionsHtml;
      html += renderScheduleTable(schedule, true);
      html += `
        <div class="panels-grid">
          <div class="card">
            <div class="card-header">Recent Activity</div>
            <div class="card-body">${renderActivity(activity?.events || activity)}</div>
          </div>
          <div class="card">
            <div class="card-header">Relay's Insights</div>
            <div class="card-body">${renderInsights(insights?.insights || insights)}</div>
          </div>
        </div>
      `;
      return html;
    }

    function renderOnboardingChecklist(onboarding) {
      if (!onboarding) return '';
      const groupId = window._groupId || 'default';
      const dismissedKey = `relay_onboarding_${groupId}`;
      if (localStorage.getItem(dismissedKey)) return '';

      const checks = [
        { id: 'business', label: 'Business set up',          done: true,                  page: null },
        { id: 'staff',    label: 'Add your team',            done: onboarding.staffCount > 1,  page: 'staff' },
        { id: 'shifts',   label: 'Configure shifts',         done: onboarding.shiftsCount > 0, page: 'settings' },
        { id: 'rates',    label: 'Set pay rates',            done: onboarding.hasRates,        page: 'settings' },
        { id: 'schedule', label: 'Generate first schedule',  done: onboarding.shiftsThisWeek > 0, page: 'schedule' },
      ];

      const allDone = checks.every(c => c.done);
      if (allDone) {
        localStorage.setItem(dismissedKey, '1');
        return '';
      }
      const doneCount = checks.filter(c => c.done).length;
      const pct = Math.round(doneCount / checks.length * 100);

      return `
        <div class="onboarding-card">
          <div class="onboarding-header">
            <div>
              <div class="onboarding-title">Getting started</div>
              <div class="onboarding-sub">Complete these steps to get Relay running for your team.</div>
            </div>
            <button class="onboarding-dismiss" onclick="dismissOnboarding()" title="Dismiss">✕</button>
          </div>
          <div class="onboarding-progress">
            <div class="onboarding-bar" style="width:${pct}%"></div>
          </div>
          <div class="onboarding-steps">
            ${checks.map(c => `
              <div class="onboarding-step ${c.done ? 'done' : ''}" ${(!c.done && c.page) ? `onclick="navigateTo('${c.page}')"` : ''}>
                <div class="step-check">${c.done ? '✓' : ''}</div>
                <span>${c.label}</span>
                ${(!c.done && c.page) ? '<span class="step-arrow">→</span>' : ''}
              </div>`).join('')}
          </div>
        </div>`;
    }

    function dismissOnboarding() {
      const groupId = window._groupId || 'default';
      localStorage.setItem(`relay_onboarding_${groupId}`, '1');
      document.querySelector('.onboarding-card')?.remove();
    }

    function renderQuickActions(overview, schedule) {
      const o = overview || {};
      const hasShifts = (schedule?.staff?.length || 0) > 0;
      const actions = [];
      actions.push({ label: 'View Schedule', icon: '📅', fn: "navigateTo('schedule')" });
      if (!hasShifts) {
        actions.push({ label: 'Generate Schedule', icon: '✨', fn: "navigateTo('schedule')" });
      }
      if (o.coverageRequests > 0) {
        actions.push({ label: `${o.coverageRequests} Open Coverage`, icon: '🚨', fn: "navigateTo('eventlog')", urgent: true });
      }
      actions.push({ label: 'Log Revenue', icon: '💰', fn: "navigateTo('income')" });
      return `
        <div class="quick-actions">
          ${actions.slice(0, 4).map(a => `
            <button class="quick-action-btn ${a.urgent ? 'urgent' : ''}" onclick="${a.fn}">
              <span>${a.icon}</span><span>${a.label}</span>
            </button>`).join('')}
        </div>`;
    }

    function renderSchedulePage(schedule, status, shifts, settings, isCurrentWeek) {
      const weekStart = (schedule && schedule.weekStart) || currentScheduleWeek;
      const s = status || { hasAssignments: false, isPublished: false, publishedAt: null };

      let banner = '';
      if (!s.hasAssignments && isCurrentWeek) {
        banner = `<div class="schedule-status empty"><span class="status-dot"></span>No schedule this week — generate one to start</div>`;
      } else if (s.isPublished) {
        banner = `<div class="schedule-status published"><span class="status-dot"></span>Published${s.publishedAt ? `<span class="status-time">${formatRelativeTime(s.publishedAt)}</span>` : ''}</div>`;
      } else if (s.hasAssignments) {
        banner = `<div class="schedule-status draft"><span class="status-dot"></span>Draft — not published yet</div>`;
      }

      const generateBtn = isCurrentWeek ? `
        <button class="${s.isPublished ? 'btn-warning' : 'btn-primary'}" style="display:inline-flex;align-items:center;gap:6px"
          onclick="generateSchedule(this,'${weekStart}')"
          ${s.isPublished ? 'title="Schedule is published. Regenerating will overwrite it."' : ''}>
          ${s.isPublished
            ? '⚠️ Regenerate'
            : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Generate Schedule'}
        </button>` : '';

      const approveBtn = isCurrentWeek ? `
        <button id="approve-btn" class="btn-primary" style="background:var(--color-success);display:inline-flex;align-items:center;gap:6px"
          onclick="approveSchedule('${weekStart}')" ${!s.hasAssignments ? 'disabled style="opacity:.5;cursor:not-allowed;background:var(--color-success)"' : ''}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          ${s.isPublished ? 'Republish' : 'Approve &amp; Publish'}
        </button>` : '';

      const copyBtn = (isCurrentWeek && !s.hasAssignments) ? `
        <button class="btn-secondary" onclick="copyLastWeek()" title="Copy last week's schedule as a draft">↩ Copy Last Week</button>` : '';

      const actionBar = isCurrentWeek
        ? `<div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">${generateBtn}${approveBtn}${copyBtn}</div>`
        : '';

      // Week-nav header (lives outside the table now since we no longer use renderScheduleTable for the full view)
      const atCurrent = currentScheduleWeek === getCurrentWeekStart();
      const weekNav = `
        <div class="schedule-nav" style="margin-bottom:12px">
          <button class="schedule-nav-btn" onclick="changeScheduleWeek(-7)">&larr; Prev</button>
          <span class="schedule-nav-label">Week of ${formatWeekRange(currentScheduleWeek)}</span>
          <button class="schedule-nav-btn" onclick="changeScheduleWeek(7)" ${atCurrent ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}>Next &rarr;</button>
        </div>`;

      return banner + actionBar + weekNav + renderShiftCentricSchedule(schedule, shifts || [], settings || {}, !!isCurrentWeek);
    }

    async function loadSchedulePage() {
      const content = document.getElementById('page-content');
      content.innerHTML = renderScheduleSkeleton();
      try {
        const [schedule, status, shifts, settings] = await Promise.all([
          apiFetch('/api/dashboard/schedule?week=' + currentScheduleWeek),
          api(`/api/schedule/status?week=${currentScheduleWeek}`),
          api('/api/shifts'),
          api('/api/settings'),
        ]);
        dashboardData.schedule = schedule;
        scheduleStatus = status;
        const isCurrentWeek = currentScheduleWeek === getCurrentWeekStart();
        content.innerHTML = renderSchedulePage(schedule, status, shifts || [], settings || {}, isCurrentWeek);
      } catch (e) {
        content.innerHTML = renderError("loadSchedulePage()");
      }
    }

    // ── Shift-centric drag/drop handlers ──
    // Drag SOURCE: a staff pill on a shift row.
    // Drop TARGET: a different shift row's staff container.
    // Operation: MOVE staff from from-shift to to-shift.
    function onStaffPillDragStart(e) {
      const pill = e.currentTarget;
      _dragState = {
        staffId:    pill.dataset.staffId,
        fromShiftId: pill.dataset.fromShiftId,
        weekStart:  pill.dataset.weekStart,
      };
      pill.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', pill.dataset.staffId);
    }
    function onStaffPillDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.drop-target-valid, .drop-target-invalid')
        .forEach(el => el.classList.remove('drop-target-valid', 'drop-target-invalid'));
    }
    function onShiftRowDragOver(e) {
      e.preventDefault();
      if (!_dragState) return;
      const target = e.currentTarget;
      const toShiftId = target.dataset.shiftId;
      const sameShift = String(toShiftId) === String(_dragState.fromShiftId);
      // Already-on-this-shift check: does target row contain a pill with the dragged staffId?
      const alreadyOn = !!target.querySelector(`.staff-pill[data-staff-id="${_dragState.staffId}"]`);
      if (sameShift || alreadyOn) {
        target.classList.add('drop-target-invalid');
        target.classList.remove('drop-target-valid');
        e.dataTransfer.dropEffect = 'none';
      } else {
        target.classList.add('drop-target-valid');
        target.classList.remove('drop-target-invalid');
        e.dataTransfer.dropEffect = 'move';
      }
    }
    function onShiftRowDragLeave(e) {
      e.currentTarget.classList.remove('drop-target-valid', 'drop-target-invalid');
    }
    async function onShiftRowDrop(e) {
      e.preventDefault();
      const target = e.currentTarget;
      target.classList.remove('drop-target-valid', 'drop-target-invalid');
      if (!_dragState) return;

      const toShiftId = target.dataset.shiftId;
      const sameShift = String(toShiftId) === String(_dragState.fromShiftId);
      const alreadyOn = !!target.querySelector(`.staff-pill[data-staff-id="${_dragState.staffId}"]`);

      if (sameShift) { _dragState = null; return; }
      if (alreadyOn) { showToast('That employee is already on this shift', 'error'); _dragState = null; return; }

      const { staffId, fromShiftId, weekStart } = _dragState;
      _dragState = null;

      try {
        await api('/api/schedule/move', 'POST', {
          staffId, fromShiftId, toShiftId, weekStart,
        });
        _lastAction = { type: 'move', staffId, fromShiftId, toShiftId, weekStart };
        await loadSchedulePage();
        showUndoToast('Shift moved');
      } catch (err) {
        showToast(err.message || 'Failed to move', 'error');
      }
    }

    async function removeStaffFromShift(e, staffId, shiftId) {
      e.stopPropagation();
      const weekStart = currentScheduleWeek;
      if (weekStart !== getCurrentWeekStart()) return;
      _lastAction = { type: 'remove', staffId, shiftId, weekStart };
      try {
        await api('/api/schedule/assign', 'DELETE', { staffId, shiftId, weekStart });
        await loadSchedulePage();
        showUndoToast('Removed from shift');
      } catch (err) {
        showToast(err.message || 'Failed to remove', 'error');
      }
    }

    async function openAddStaffToShift(shiftId, shiftName, alreadyAssignedIds) {
      const assigned = new Set((alreadyAssignedIds || []).map(String));
      let allStaff = [];
      try { allStaff = await api('/api/staff') || []; }
      catch (e) { showToast('Could not load staff', 'error'); return; }
      const candidates = allStaff.filter(s => !assigned.has(String(s.id)));

      const body = candidates.length === 0
        ? '<div class="pick-staff-empty">All staff are already on this shift.</div>'
        : `<div class="pick-staff-list">
            ${candidates.map(s => `
              <div class="pick-staff-row" onclick="confirmAddStaffToShift(${s.id}, ${shiftId}, ${JSON.stringify(s.name || '')})">
                ${renderAvatar(s.name || '', 28)}
                <div>
                  <div style="font-weight:500">${escapeHtml(s.name || '')}</div>
                  <div style="font-size:12px;color:var(--color-text-muted)">${escapeHtml(s.role || '')}</div>
                </div>
              </div>`).join('')}
          </div>`;

      showModal(`Add staff to ${shiftName}`, body, null, 'Cancel');
    }

    async function confirmAddStaffToShift(staffId, shiftId, staffName) {
      // Close the modal
      document.getElementById('modal-backdrop')?.remove();
      const weekStart = currentScheduleWeek;
      try {
        await api('/api/schedule/assign', 'POST', { staffId, shiftId, weekStart });
        _lastAction = { type: 'add', staffId, shiftId, weekStart };
        await loadSchedulePage();
        showUndoToast(`${staffName} added`);
      } catch (err) {
        showToast(err.message || 'Failed to assign', 'error');
      }
    }

    function showUndoToast(message) {
      const existing = document.getElementById('undo-toast');
      if (existing) {
        if (existing._timeout) clearTimeout(existing._timeout);
        existing.remove();
      }
      const toast = document.createElement('div');
      toast.id = 'undo-toast';
      toast.className = 'undo-toast';
      toast.innerHTML = `<span>${message}</span><button onclick="undoLastAction()">Undo</button><div class="undo-timer"></div>`;
      document.body.appendChild(toast);
      const timerBar = toast.querySelector('.undo-timer');
      timerBar.style.transition = 'width 5s linear';
      requestAnimationFrame(() => { timerBar.style.width = '0%'; });
      toast._timeout = setTimeout(() => { toast.remove(); _lastAction = null; }, 5000);
    }

    async function undoLastAction() {
      if (!_lastAction) return;
      const action = _lastAction; _lastAction = null;
      const toast = document.getElementById('undo-toast');
      if (toast) { if (toast._timeout) clearTimeout(toast._timeout); toast.remove(); }
      try {
        if (action.type === 'move') {
          await api('/api/schedule/move', 'POST', {
            staffId: action.staffId,
            fromShiftId: action.toShiftId,
            toShiftId: action.fromShiftId,
            weekStart: action.weekStart,
          });
        } else if (action.type === 'remove') {
          await api('/api/schedule/assign', 'POST', {
            staffId: action.staffId, shiftId: action.shiftId, weekStart: action.weekStart,
          });
        } else if (action.type === 'add') {
          await api('/api/schedule/assign', 'DELETE', {
            staffId: action.staffId, shiftId: action.shiftId, weekStart: action.weekStart,
          });
        } else if (action.type === 'swap') {
          await api('/api/schedule/swap', 'POST', {
            fromStaffId: action.toStaffId, toStaffId: action.fromStaffId,
            shiftId: action.shiftId, weekStart: action.weekStart,
          });
        }
        await loadSchedulePage();
        showToast('Undone');
      } catch (err) {
        showToast('Could not undo', 'error');
      }
    }

    async function copyLastWeek() {
      const d = parseDate(currentScheduleWeek);
      d.setDate(d.getDate() - 7);
      const lastWeekStr = formatDate(d);
      try {
        await api('/api/schedule/generate', 'POST', { weekStart: currentScheduleWeek, copyFromWeek: lastWeekStr });
        await loadSchedulePage();
        showToast("Last week's schedule copied as draft");
      } catch (err) {
        showToast(err.message || 'Failed to copy', 'error');
      }
    }

    async function generateSchedule(btn, weekStart) {
      // Guard: confirm if schedule is already published
      if (scheduleStatus?.isPublished) {
        const ok = await showConfirmModal(
          '⚠️ Schedule is published',
          "This week's schedule has already been sent to your team. Regenerating will overwrite all current assignments. Are you sure?",
          'Yes, regenerate',
          'Cancel'
        );
        if (!ok) return;
      }
      const originalLabel = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = 'Generating...';
      try {
        const result = await api('/api/schedule/generate', 'POST', { weekStart });
        const warnings = (result && result.warnings) || [];
        await loadSchedulePage();
        if (warnings.length > 0) {
          const container = document.getElementById('page-content');
          container.querySelectorAll('.warning-banner').forEach(b => b.remove());
          for (const w of warnings) {
            const banner = document.createElement('div');
            banner.className = 'warning-banner';
            banner.innerHTML = `<span>⚠️</span><span>${escapeHtml(w.message)}</span><button onclick="this.parentElement.remove()" aria-label="Dismiss">✕</button>`;
            container.prepend(banner);
          }
          showToast(`Schedule generated (${warnings.length} warning${warnings.length === 1 ? '' : 's'})`, 'warning');
        } else {
          showToast('Schedule generated');
        }
      } catch (e) {
        showToast(e.message, 'error');
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    }

    async function approveSchedule(weekStart) {
      const btn = document.getElementById('approve-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Publishing...'; }
      try {
        const r = await api('/api/schedule/approve', 'POST', { weekStart });
        showToast(`Schedule published! ${r && r.staffNotified != null ? r.staffNotified : 0} staff notified.`);
        await loadSchedulePage();
      } catch (e) {
        showToast(e.message, 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Approve &amp; Publish';
        }
      }
    }

    function renderPlaceholder(name, iconSvg) {
      return `
        <div class="placeholder-page">

            <h3>${escapeHtml(name)} coming soon</h3>

      const div = document.createElement('div');

    // ── Navigation ──
    function navigateTo(page) {
      currentPage = page;
      window.location.hash = page;

      // Update active nav
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
      });

      document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;

      // Close sidebar on mobile
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('visible');

      loadPage(page);
    }

    async function loadPage(page) {
      const content = document.getElementById('page-content');

      switch (page) {
        case 'overview':
          content.innerHTML = renderOverviewSkeleton();
          try {
            const data = await loadOverviewData();
            content.innerHTML = renderOverview(data);
          } catch {
            content.innerHTML = renderError("loadPage('overview')");
          }
          break;

        case 'schedule':
          loadSchedulePage();
          break;

        case 'staff':
          showSkeleton();
          loadStaffPage();
          break;

        case 'payroll':
          showSkeleton();
          loadPayrollPage();
          break;

        case 'income':
          showSkeleton();
          loadIncomePage();
          break;

        case 'timeclock':
          showSkeleton();
          loadTimeClockPage();
          break;

        case 'eventlog':
          showSkeleton();
          loadEventLogPage();
          break;

        case 'settings':
          showSkeleton();
          loadSettingsPage();
          break;
      }
    }

    async function changeScheduleWeek(delta) {
      const d = parseDate(currentScheduleWeek);
      d.setDate(d.getDate() + delta);
      const next = formatDate(d);
      const currentWeek = getCurrentWeekStart();
      // Clamp: don't allow navigating into future weeks
      currentScheduleWeek = (delta > 0 && next > currentWeek) ? currentWeek : next;
      await loadSchedulePage();
    }

      const btn = document.getElementById('refresh-btn');

    function escapeJs(str) {

    function openAddStaff() {
      showModal('Add Staff Member',
        `<label>Name</label><input id="m-name" placeholder="Full name" />
         <label>Role</label><input id="m-role" placeholder="e.g. Server, Cook" />`,
        async () => {

      showModal(`Remove ${name}?`,
        `<p>This will remove ${escapeHtml(name)} from Relay. Their pay history is kept. The Telegram group will be notified.</p>`,
        async () => {
          try {
            await api(`/api/staff/${id}`, 'DELETE');

    let currentIncomeWeek  = getCurrentWeekStart();

    // Revenue categories — loaded dynamically from /api/revenue/types
    const CATEGORY_PALETTE = [
      '#F5A623', '#4A90E2', '#2D7D5A', '#E8C547',
      '#D95F2B', '#9B59B6', '#9A8880', '#3498DB',
      '#E74C3C', '#2ECC71'
    ];
    function categoryColor(cat) {
      if (!cat) return CATEGORY_PALETTE[6];
      let h = 0;
      for (let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) & 0xfffffff;
      return CATEGORY_PALETTE[h % CATEGORY_PALETTE.length];
    }
    function categoryLabel(cat) { return cat || 'Other'; }

    let _revenueTypes = null;
    async function getRevenueTypes() {
      if (_revenueTypes !== null) return _revenueTypes;
      try { _revenueTypes = await api('/api/revenue/types'); } catch (e) { _revenueTypes = []; }
      return _revenueTypes;
    }
    function invalidateRevenueTypesCache() { _revenueTypes = null; }

    async function buildCategorySelector(selectId) {
      const types = await getRevenueTypes();
      const sel = document.getElementById(selectId);
      if (!sel) return;
      const wrap = sel.closest('.cat-wrap') || sel.parentElement;
      if (!types || types.length === 0) {
        if (wrap) wrap.style.display = 'none';
        return;
      }
      if (wrap) wrap.style.display = '';
      sel.innerHTML = '<option value="">Category</option>' +
        types.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)}</option>`).join('');
    }

    async function loadPayrollPage() {
      try {
        const [payroll, settings, planned] = await Promise.all([
          api(`/api/payroll?week=${currentPayrollWeek}`),
          api('/api/settings'),
          api(`/api/payroll/planned?week=${currentPayrollWeek}`),
        ]);
        renderPayrollPage(payroll || [], settings || {}, planned || { rows: [], totalPlannedHours: 0, totalPlannedCost: 0 });
      } catch (e) {
        showToast(e.message, 'error');
        renderErrorInline("loadPage('payroll')");
      }
    }

    function buildUnifiedPayroll(payroll, planned, timeclockEnabled) {
      const recById = Object.fromEntries((payroll || []).map(r => [String(r.staff_id), r]));
      const result = [];
      const seen = new Set();

      // Seed from planned (people scheduled this week)
      (planned?.rows || []).forEach(p => {
        const k = String(p.staffId);
        seen.add(k);
        const rec = recById[k];
        if (rec) {
          // Has payroll_records — actual or manual override
          result.push({
            staff_id: rec.staff_id,
            name: rec.name || p.staffName,
            role: rec.role || p.role,
            total_hours: Number(rec.total_hours || 0),
            total_gross_pay: Number(rec.total_gross_pay || 0),
            _plannedHours: p.plannedHours,
            _plannedCost: p.plannedCost,
            _hasRecord: true,
          });
        } else {
          // No payroll_records — default depends on timeclock mode
          result.push({
            staff_id: p.staffId,
            name: p.staffName,
            role: p.role,
            total_hours: timeclockEnabled ? 0 : p.plannedHours,
            total_gross_pay: timeclockEnabled ? 0 : p.plannedCost,
            _plannedHours: p.plannedHours,
            _plannedCost: p.plannedCost,
            _hasRecord: false,
          });
        }
      });

      // Anyone with payroll_records but NOT scheduled (e.g., past-week manual entries)
      (payroll || []).forEach(r => {
        const k = String(r.staff_id);
        if (!seen.has(k)) {
          result.push({
            staff_id: r.staff_id,
            name: r.name,
            role: r.role,
            total_hours: Number(r.total_hours || 0),
            total_gross_pay: Number(r.total_gross_pay || 0),
            _plannedHours: 0,
            _plannedCost: 0,
            _hasRecord: true,
          });
        }
      });

      return result;
    }

    function renderPayrollPage(payroll, settings, planned) {
      const timeclockEnabled = settings.timeclockEnabled !== false;
      const unifiedRows = buildUnifiedPayroll(payroll, planned, timeclockEnabled);

      const totalPay = unifiedRows.reduce((s, r) => s + (r.total_gross_pay || 0), 0);
      const totalHrs = unifiedRows.reduce((s, r) => s + (r.total_hours || 0), 0);
      const staffPaid = unifiedRows.filter(r => (r.total_hours || 0) > 0).length;
      const plannedRows = planned?.rows || [];
      const plannedCost = Number(planned?.totalPlannedCost || 0);
      const plannedHours = Number(planned?.totalPlannedHours || 0);
      const showPlanned = timeclockEnabled && plannedRows.length > 0;

      const rateOf = r => (r.total_hours || 0) > 0
        ? (r.total_gross_pay || 0) / (r.total_hours || 0) : 0;

      const rows = unifiedRows.map(r => {
        const safeName = String(r.name || '').replace(/"/g, '&quot;');
        return `
        <tr>
          <td>${escapeHtml(r.name || '')}</td>
          <td><span class="role-badge">${escapeHtml(r.role || '')}</span></td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${(r.total_hours || 0).toFixed(1)}h</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(rateOf(r))}/h</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${formatCurrency(r.total_gross_pay || 0)}</td>
          <td style="text-align:right">
            <button class="btn-small" data-staff-id="${r.staff_id}" data-name="${safeName}" data-hours="${(r.total_hours || 0).toFixed(2)}" data-pay="${(r.total_gross_pay || 0).toFixed(2)}" onclick="editPayrollRowFromBtn(this)" title="Edit hours and pay">✏ Edit</button>
          </td>
        </tr>`;
      }).join('');

      const pvaRows = plannedRows.map(p => {
        const actual = payroll.find(a => String(a.staff_id) === String(p.staffId)) || {};
        const actualHrs = actual.total_hours || 0;
        const actualPay = actual.total_gross_pay || 0;
        const variance = actualPay - p.plannedCost;
        const vColor = variance > 0 ? 'var(--color-danger)' : 'var(--color-success)';
        return `<tr>
          <td>${escapeHtml(p.staffName || '')}</td>
          <td><span class="role-badge">${escapeHtml(p.role || '')}</span></td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${p.plannedHours.toFixed(1)}h</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(p.plannedCost)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${actualHrs.toFixed(1)}h</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(actualPay)}</td>
          <td style="text-align:right;font-variant-numeric:tabular-nums;color:${vColor}">${variance > 0 ? '+' : ''}${formatCurrency(variance)}</td>
        </tr>`;
      }).join('');

      const thisWeek = getCurrentWeekStart();
      const atCurrent = currentPayrollWeek >= thisWeek;
      const incomeHidden = (settings.hiddenPages || []).includes('income');

      // 4-card grid; Planned Labor only shown when timeclock is on
      const statCards = `
        <div class="stat-card"><div class="stat-label">Labor Cost</div><div class="stat-value">${formatCurrency(totalPay)}</div></div>
        <div class="stat-card"><div class="stat-label">Total Hours</div><div class="stat-value">${totalHrs.toFixed(1)}h</div></div>
        ${timeclockEnabled ? `
          <div class="stat-card">
            <div class="stat-label">Planned Labor</div>
            <div class="stat-value">${plannedRows.length ? formatCurrency(plannedCost) : '—'}</div>
            <div class="stat-sub">${plannedRows.length ? 'from published schedule' : 'No schedule this week'}</div>
          </div>` : `
          <div class="stat-card">
            <div class="stat-label">Avg Hourly Rate</div>
            <div class="stat-value">${totalHrs > 0 ? formatCurrency(totalPay / totalHrs) : '—'}</div>
            <div class="stat-sub">paid as scheduled</div>
          </div>`}
        <div class="stat-card"><div class="stat-label">Staff Paid</div><div class="stat-value">${staffPaid}</div></div>
      `;

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Payroll</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-small" onclick="changePayrollWeek(-7)">&larr; Prev</button>
            <span style="font-size:14px;font-weight:600;color:var(--text-secondary)">Week of ${formatWeekRange(currentPayrollWeek)}</span>
            <button class="btn-small" onclick="changePayrollWeek(7)" ${atCurrent ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>Next &rarr;</button>
            <a href="/api/payroll/spreadsheet?week=${currentPayrollWeek}" download class="btn-small">📥 Export CSV</a>
          </div>
        </div>

        ${!timeclockEnabled ? `<div class="schedule-status empty" style="margin-bottom:16px"><span class="status-dot"></span>Time Clock is off — showing scheduled hours and pay</div>` : ''}

        <div class="stat-grid" style="margin-bottom:20px;grid-template-columns:repeat(4,1fr)">
          ${statCards}
        </div>

        <div class="card">
          <table class="data-table payroll-table">
            <thead><tr>
              <th>Name</th><th>Role</th>
              <th style="text-align:right">Hours</th>
              <th style="text-align:right">Rate</th>
              <th style="text-align:right">Gross Pay</th>
              <th style="text-align:right">Actions</th>
            </tr></thead>
            <tbody>${rows || renderEmptyRow(6, '🧾', 'No payroll yet for this week', 'Generate and approve a schedule. Once published, payroll calculations appear here.', 'Open Schedule', "navigateTo('schedule')")}</tbody>
            ${unifiedRows.length ? `<tfoot><tr style="border-top:2px solid var(--surface-border);font-weight:700;color:var(--text)">
              <td>TOTAL</td><td>—</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${totalHrs.toFixed(1)}h</td>
              <td style="text-align:right">—</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(totalPay)}</td>
              <td></td>
            </tr></tfoot>` : ''}
          </table>
        </div>

        ${showPlanned ? `
        <div class="card" style="margin-top:16px">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
            <span>Planned vs Actual Labor</span>
            <span style="font-size:12px;font-weight:400;color:var(--text-muted)">based on published schedule × hourly rates</span>
          </div>
          <table class="data-table">
            <thead><tr>
              <th>Staff</th><th>Role</th>
              <th style="text-align:right">Planned Hrs</th>
              <th style="text-align:right">Planned Cost</th>
              <th style="text-align:right">Actual Hrs</th>
              <th style="text-align:right">Actual Pay</th>
              <th style="text-align:right">Variance</th>
            </tr></thead>
            <tbody>${pvaRows}</tbody>
            <tfoot><tr style="border-top:2px solid var(--surface-border);font-weight:700;color:var(--text)">
              <td colspan="2">Total</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${plannedHours.toFixed(1)}h</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(plannedCost)}</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${totalHrs.toFixed(1)}h</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${formatCurrency(totalPay)}</td>
              <td style="text-align:right;font-variant-numeric:tabular-nums">${(totalPay - plannedCost) > 0 ? '+' : ''}${formatCurrency(totalPay - plannedCost)}</td>
            </tr></tfoot>
          </table>
        </div>` : ''}

        ${incomeHidden ? `<div style="margin-top:16px;text-align:center">
          <a onclick="navigateTo('income')" style="font-size:13px;color:var(--accent);cursor:pointer;text-decoration:none">Track revenue and tips →</a>
        </div>` : ''}
      `);
    }

    // ───────────────────────────────────────────
    // ── PAGE: INCOME ──
    // ───────────────────────────────────────────
    async function loadIncomePage() {
      try {
        const [payroll, revenue, tips, settings] = await Promise.all([
          api(`/api/payroll?week=${currentIncomeWeek}`),
          api(`/api/revenue/daily?weekStart=${currentIncomeWeek}`),
          api(`/api/tips?weeks=4`),
