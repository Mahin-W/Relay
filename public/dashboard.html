<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="relay-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Focus visible — accessible keyboard nav ── */
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    :root {
      /* ── New design tokens ── */
      --color-bg:           #FAF7F2;
      --color-surface:      #FFFFFF;
      --color-surface-alt:  #F4EFE6;
      --color-border:       #E8DFD0;
      --color-border-light: #F0E8DC;
      --color-accent:       #D95F2B;
      --color-accent-hover: #C4511F;
      --color-accent-dim:   #FDF0E8;
      --color-accent-text:  #8B3A16;
      --color-text-primary: #1C1410;
      --color-text-secondary:#4A3F35;
      --color-text-muted:   #9A8880;
      --color-text-inverse: #FFFFFF;
      --color-success:      #2D7D5A;
      --color-success-dim:  #E6F4ED;
      --color-success-text: #1A5C3E;
      --color-warning:      #D97706;
      --color-warning-dim:  #FEF3C7;
      --color-warning-text: #92400E;
      --color-danger:       #DC2626;
      --color-danger-dim:   #FEE2E2;
      --color-danger-text:  #991B1B;
      --color-sidebar-bg:   #1C1410;
      --color-sidebar-text: #9A8880;
      --color-sidebar-hover:#2D2520;
      --color-sidebar-active-bg: rgba(217,95,43,0.15);
      --color-sidebar-active:    #D95F2B;
      --color-sidebar-border: rgba(255,255,255,0.06);
      /* Spacing */
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
      --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
      /* Radius */
      --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(28,20,16,0.06), 0 1px 2px rgba(28,20,16,0.04);
      --shadow-md: 0 4px 12px rgba(28,20,16,0.08), 0 2px 4px rgba(28,20,16,0.04);
      --shadow-lg: 0 8px 24px rgba(28,20,16,0.10), 0 4px 8px rgba(28,20,16,0.06);
      --shadow-accent: 0 4px 16px rgba(217,95,43,0.25);
      /* Transitions */
      --transition-fast: 120ms ease;
      --transition-base: 200ms ease;
      --transition-slow: 350ms ease;
      /* ── Backward-compat aliases for inline styles ── */
      --bg: var(--color-bg);
      --surface: var(--color-surface);
      --surface-alt: var(--color-surface-alt);
      --surface-border: var(--color-border);
      --text: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-muted: var(--color-text-muted);
      --accent: var(--color-accent);
      --accent-hover: var(--color-accent-hover);
      --accent-light: var(--color-accent-dim);
      --success: var(--color-success);
      --success-light: var(--color-success-dim);
      --sidebar-bg: var(--color-sidebar-bg);
      --sidebar-text: var(--color-sidebar-text);
      --sidebar-text-hover: rgba(250,247,242,0.8);
      --sidebar-text-active: var(--color-sidebar-active);
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: width 0.2s ease;
    }

    .sidebar-brand {
      padding: 24px 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand-name {
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.2;
    }

    .sidebar-brand-restaurant {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.3;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .nav-item:hover {
      color: var(--sidebar-text-hover);
    }

    .nav-item.active {
      color: var(--sidebar-text-active);
      border-left-color: var(--sidebar-text-active);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .nav-item-label {
      white-space: nowrap;
    }

    .sidebar-bottom {
      padding: 16px 20px;
      border-top: 1px solid rgba(250,247,242,0.08);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: rgba(250,247,242,0.4);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.15s;
    }

    .logout-btn:hover {
      color: rgba(250,247,242,0.7);
    }

    .logout-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── Main Content ── */
    .main-content {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 0.2s ease;
    }

    .top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-bar h2 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--text);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .week-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .refresh-btn svg {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
    }

    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .content-area {
      flex: 1;
      padding: 24px;
    }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--surface-border);
      transition: box-shadow var(--transition-base), border-color var(--transition-base);
    }
    .stat-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--color-border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.1;
    }

    .stat-sub {
      font-size: 12px;
      margin-top: 6px;
    }

    .stat-sub.green { color: var(--success); }
    .stat-sub.orange { color: var(--accent); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      overflow: hidden;
      transition: box-shadow var(--transition-base);
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .card-body {
      padding: 16px 20px;
    }

    /* ── Schedule Table ── */
    .schedule-wrapper {
      margin-bottom: 24px;
    }

    .schedule-wrapper.compact .schedule-scroll {
      max-height: 280px;
      overflow-y: auto;
    }

    .schedule-scroll {
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .schedule-table thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .schedule-table th {
      background: var(--surface-alt);
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      border-bottom: 1px solid var(--surface-border);
      white-space: nowrap;
    }

    .schedule-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--surface-border);
      vertical-align: top;
    }

    .schedule-table tbody tr:last-child td {
      border-bottom: none;
    }

    .staff-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    .staff-role {
      font-size: 11px;
      color: var(--text-muted);
    }

    .shift-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      margin: 1px 0;
    }

    .shift-pill.lunch  { background: var(--color-accent-dim);  color: var(--color-accent-text); }
    .shift-pill.dinner { background: rgba(217,95,43,0.1);      color: var(--color-accent-text); }
    .shift-pill.brunch { background: var(--color-success-dim); color: var(--color-success-text); }
    .shift-pill.other  { background: var(--color-surface-alt); color: var(--color-text-secondary); }

    .hours-total {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    /* ── Two panels ── */
    .panels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Activity / Insights ── */
    .event-list, .insight-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-item, .insight-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.4;
    }

    .event-dot, .insight-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .dot-orange { background: var(--accent); }
    .dot-green { background: var(--success); }
    .dot-yellow { background: #E5A100; }
    .dot-blue { background: #229ED9; }
    .dot-gray { background: var(--text-muted); }

    .event-text { flex: 1; color: var(--text-secondary); }
    .event-time { font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

    .insight-text { flex: 1; color: var(--text-secondary); }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .empty-state svg {
      margin-bottom: 8px;
    }

    .empty-state.green { color: var(--success); }

    /* ── Schedule Nav ── */
    .schedule-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-border);
    }

    .schedule-nav-btn {
      background: none;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .schedule-nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .schedule-nav-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      min-width: 160px;
      text-align: center;
    }

    /* ── Placeholder pages ── */
    .placeholder-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }

    .placeholder-card {
      max-width: 400px;
      padding: 48px;
      text-align: center;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }

    .placeholder-card svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .placeholder-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .placeholder-card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ── Skeleton ── */
    .skeleton {
      background: var(--surface-border);
      border-radius: 4px;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .skeleton-stat {
      height: 28px;
      width: 80px;
      margin-top: 8px;
    }

    .skeleton-row {
      height: 40px;
      width: 100%;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .skeleton-line {
      height: 14px;
      width: 80%;
      margin-bottom: 12px;
    }

    /* ── Error state ── */
    .error-state {
      text-align: center;
      padding: 32px 16px;
    }

    .error-state p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .retry-btn:hover {
      border-color: var(--accent);
    }

    /* ── Hamburger (mobile) ── */
    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger svg {
      width: 22px;
      height: 22px;
      color: var(--text);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28,20,16,0.5);
      z-index: 90;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
      }

      .sidebar-brand-text,
      .nav-item-label,
      .sidebar-bottom span {
        display: none;
      }

      .sidebar-brand {
        padding: 20px 16px;
        justify-content: center;
      }

      .nav-item {
        padding: 10px 0;
        justify-content: center;
        border-left: none;
        border-right: 3px solid transparent;
      }

      .nav-item.active {
        border-right-color: var(--sidebar-text-active);
        border-left-color: transparent;
      }

      .logout-btn {
        justify-content: center;
      }

      .main-content {
        margin-left: 60px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .panels-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 220px;
        transform: translateX(-220px);
        transition: transform 0.25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.visible {
        display: block;
      }

      .sidebar-brand-text,
      .nav-item-label,
      .sidebar-bottom span {
        display: unset;
      }

      .nav-item {
        padding: 10px 20px;
        justify-content: flex-start;
        border-left: 3px solid transparent;
        border-right: none;
      }

      .nav-item.active {
        border-left-color: var(--sidebar-text-active);
        border-right-color: transparent;
      }

      .main-content {
        margin-left: 0;
      }

      .hamburger {
        display: block;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }

      .content-area {
        padding: 16px;
      }

      .top-bar {
        padding: 12px 16px;
      }
    }

    /* ── Toast notifications ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      animation: slideUp .2s ease;
      max-width: 360px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .toast-success { background: var(--color-success); color: var(--color-text-inverse); }
    .toast-error   { background: var(--color-danger);  color: var(--color-text-inverse); }
    .toast-warning { background: var(--color-accent);  color: var(--color-text-inverse); }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    /* ── Modal ── */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28,20,16,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      border: 1px solid var(--color-border);
    }
    .modal-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--color-text-primary);
      margin: 0 0 16px;
    }
    .modal-body {
      color: var(--color-text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-body label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
      margin-top: 12px;
    }
    .modal-body input,
    .modal-body select,
    .modal-body textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: inherit;
      transition: border-color var(--transition-fast);
    }
    .modal-body input:focus,
    .modal-body select:focus,
    .modal-body textarea:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-dim);
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .btn-primary {
      background: var(--color-accent);
      color: var(--color-text-inverse);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background var(--transition-fast), box-shadow var(--transition-fast);
    }
    .btn-primary:hover { background: var(--color-accent-hover); box-shadow: var(--shadow-accent); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .btn-secondary:hover { background: var(--color-border); border-color: var(--color-text-muted); }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--color-text-primary);
      margin: 0;
    }

    /* ── Data table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .data-table th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--color-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid var(--color-border-light);
      color: var(--color-text-primary);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--color-bg); }

    /* ── Badges & small buttons ── */
    .role-badge {
      background: var(--color-accent-dim);
      color: var(--color-accent);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.active  { background: var(--color-success-dim);  color: var(--color-success); }
    .status-badge.inactive { background: var(--color-surface-alt); color: var(--color-text-muted); }
    .btn-small {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      cursor: pointer;
      margin-right: 4px;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .btn-small:hover { background: var(--color-border); border-color: var(--color-text-muted); }
    .btn-danger {
      border-color: var(--color-danger-dim);
      background: var(--color-danger-dim);
      color: var(--color-danger);
    }
    .btn-danger:hover { background: var(--color-danger-dim); filter: brightness(0.95); }
    .clickable-name {
      cursor: pointer;
      font-weight: 600;
      color: var(--color-accent);
    }
    .clickable-name:hover { text-decoration: underline; }

    /* ── Time Clock ── */
    .live-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .live-card {
      background: var(--color-accent-dim);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* ── Settings form ── */
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .form-input {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--color-bg);
      color: var(--color-text-primary);
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }

    /* ── Dark mode palette ── */
    :root.dark {
      --color-bg:            #141210;
      --color-surface:       #1E1A17;
      --color-surface-alt:   #252018;
      --color-border:        #2E2620;
      --color-border-light:  #3A3028;
      --color-text-primary:  #F5F0EB;
      --color-text-secondary:#C4B8B0;
      --color-text-muted:    #7A6E68;
      --color-text-inverse:  #FFFFFF;
      --color-accent-dim:    #2A1A0E;
      --color-accent-text:   #F4A87C;
      --color-success-dim:   #1A3028;
      --color-success-text:  #5BCFA0;
      --color-warning-dim:   #3A2A10;
      --color-warning-text:  #FCD34D;
      --color-danger-dim:    #3A1515;
      --color-danger-text:   #F87171;
      --color-sidebar-bg:    #0E0C0A;
      --color-sidebar-hover: #1A1610;
      /* legacy aliases */
      --bg: #141210; --surface: #1E1A17; --surface-alt: #252018;
      --surface-border: #2E2620; --text: #F5F0EB;
      --text-secondary: #C4B8B0; --text-muted: #7A6E68;
      --accent: #D95F2B; --accent-hover: #C4511F; --accent-light: #2A1A0E;
      --success: #2D7D5A; --success-light: #1A3028; --sidebar-bg: #0E0C0A;
    }
    :root.dark body { background: var(--color-bg); color: var(--color-text-primary); }

    /* ── Warning banner (schedule generate no-availability) ── */
    .warning-banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--color-warning-dim); border: 1px solid var(--color-warning);
      border-radius: 8px; padding: 12px 16px;
      margin-bottom: 16px; font-size: 14px; color: var(--color-warning-text);
    }
    :root.dark .warning-banner { background: #3A2A10; color: #FCD34D; border-color: #92400E; }
    .warning-banner button {
      margin-left: auto; background: none; border: none;
      cursor: pointer; color: inherit; font-size: 16px;
    }

    /* ── Daily revenue grid ── */
    .revenue-section { margin-top: 24px; }
    .revenue-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px;
    }
    .week-total { font-weight: 700; font-size: 18px; color: var(--text); }
    .revenue-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    }
    .revenue-day {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 8px; padding: 12px; min-height: 170px;
      display: flex; flex-direction: column;
    }
    .day-label {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .day-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .day-total { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .day-entries { flex: 1; overflow-y: auto; max-height: 110px; margin-bottom: 8px; }
    .revenue-entry {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--surface-alt);
    }
    .entry-amount { font-weight: 600; color: var(--text); }
    .entry-note {
      color: var(--text-muted); flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 11px;
    }
    .entry-delete {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 0 2px; font-size: 11px;
    }
    .entry-delete:hover { color: var(--color-danger); }
    .add-entry { margin-top: auto; }
    .revenue-input, .note-input {
      width: 100%; padding: 4px 6px;
      border: 1px solid var(--surface-border); border-radius: 4px;
      font-size: 12px; margin-bottom: 4px; background: var(--bg); color: var(--text);
      font-family: inherit;
    }
    .note-input { font-size: 11px; color: var(--text); }
    .add-btn {
      width: 100%; padding: 4px;
      background: var(--accent-light); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--accent);
      font-size: 11px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .add-btn:hover { background: var(--accent); color: white; }

    /* ── Revenue bar chart ── */
    .revenue-chart { margin-top: 24px; padding: 16px 0; }
    .chart-bars {
      display: flex; gap: 8px; align-items: flex-end;
      height: 140px; padding-bottom: 4px;
      border-bottom: 1px solid var(--surface-border);
    }
    .chart-col {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; height: 100%;
    }
    .bar-container { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bar-fill {
      width: 100%; border-radius: 4px 4px 0 0;
      min-height: 2px; transition: height 0.3s ease;
      background: var(--accent);
    }
    .bar-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .bar-amount { font-size: 10px; color: var(--text-secondary); font-weight: 600; }

    /* Stacked-bar segments (colored by category) */
    .bar-segment {
      width: 100%;
      min-height: 1px;
    }
    .bar-segment:first-child { border-radius: 4px 4px 0 0; }
    .bar-segment:last-child { border-radius: 0; }
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-bottom: 8px; font-size: 12px; color: var(--text-secondary);
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .category-dot {
      display: inline-block;
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Responsive revenue grid ── */
    @media (max-width: 900px) {
      .revenue-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
      .revenue-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Time clock table ── */
    .timeclock-table { width: 100%; border-collapse: collapse; }
    .timeclock-table th {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 8px 12px; text-align: left;
      border-bottom: 2px solid var(--surface-border); background: var(--surface-alt);
    }
    .timeclock-table td {
      padding: 12px; border-bottom: 1px solid var(--surface-border);
      font-size: 14px; vertical-align: middle; color: var(--text);
    }
    .timeclock-table tr.expandable { cursor: pointer; }
    .timeclock-table tr.expandable:hover td { background: var(--surface-alt); }
    .row-warning td { border-left: 3px solid var(--color-warning); }
    .clock-entries-row td { background: var(--surface-alt); padding: 12px 24px; }
    .clock-entries-row.hidden { display: none; }
    .clock-entry {
      display: flex; gap: 16px; align-items: center;
      padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--surface-border);
      color: var(--text-secondary);
    }
    .clock-entry:last-child { border-bottom: none; }
    .text-warning { color: var(--color-accent); font-weight: 600; }
    .text-success { color: var(--success); font-weight: 600; }

    /* ── Alert banner ── */
    .alert-banner {
      border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .alert-banner.orange { background: var(--color-warning-dim); border: 1px solid var(--color-warning); color: var(--color-warning-text); }
    :root.dark .alert-banner.orange { background: #3A2A10; color: #FCD34D; }
    .alert-row { display: flex; align-items: center; gap: 8px; }
    .alert-action {
      margin-left: auto; padding: 4px 12px;
      background: var(--color-surface); color: var(--color-warning-text);
      border: 1px solid var(--color-warning); border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .alert-action:hover { background: var(--color-warning-dim); filter: brightness(0.96); }

    /* ── Event log ── */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-tab {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid var(--surface-border);
      background: var(--surface); font-size: 13px;
      cursor: pointer; color: var(--text-secondary);
      font-family: inherit;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .filter-tab:not(.active):hover { background: var(--color-surface-alt); border-color: var(--color-text-muted); }
    .event-card {
      display: flex; gap: 16px; align-items: flex-start;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 16px; margin-bottom: 12px;
    }
    .event-card.coverage  { border-left: 3px solid var(--color-accent); }
    .event-card.trade     { border-left: 3px solid var(--color-success); }
    .event-card.overtime  { border-left: 3px solid var(--color-warning); }
    .event-icon { display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; flex-shrink:0; }
    .event-icon svg { width:16px; height:16px; }
    .event-card.coverage .event-icon  { background:var(--color-accent-dim);  color:var(--color-accent); }
    .event-card.trade .event-icon     { background:var(--color-success-dim); color:var(--color-success); }
    .event-card.overtime .event-icon  { background:var(--color-warning-dim); color:var(--color-warning); }
    .event-body { flex: 1; }
    .event-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .event-meta { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .event-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.green  { background: var(--success-light); color: var(--success); }
    .badge.red    { background: var(--color-danger-dim);  color: var(--color-danger-text); }
    .badge.orange { background: var(--color-warning-dim); color: var(--color-warning-text); }
    .badge.grey   { background: var(--surface-alt); color: var(--text-muted); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 12px; color: var(--text-secondary);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state h3 { margin-bottom: 4px; color: var(--text); }

    /* ── Settings sections ── */
    .settings-section {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    .summary-bar-wrap {
      display: flex; align-items: center;
      gap: 12px; padding: 8px 0;
      border-bottom: 1px solid var(--surface-border);
    }
    .summary-bar-label {
      width: 80px; font-size: 13px;
      color: var(--text-muted); font-weight: 500;
    }
    .summary-bar-track {
      flex: 1; height: 8px;
      background: var(--surface-border);
      border-radius: 4px; overflow: hidden;
    }
    .summary-bar-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.4s ease;
    }
    .summary-bar-amount {
      width: 80px; font-size: 13px;
      font-weight: 600; text-align: right;
      color: var(--text);
    }

    /* ── Staff avatars ── */
    .staff-avatar {
      border-radius: 50%;
      display: inline-flex; align-items: center;
      justify-content: center;
      font-weight: 700; letter-spacing: -0.02em;
      flex-shrink: 0; user-select: none;
    }

    /* ── Keyboard kbd ── */
    .kbd {
      display: inline-block;
      padding: 2px 8px;
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-bottom-width: 2px;
      border-radius: 4px;
      font-size: 12px; font-weight: 600;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      color: var(--color-text-secondary);
      line-height: 1.2;
    }
    .shortcuts-grid {
      display: flex; flex-direction: column; gap: 2px;
    }
    .shortcut-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border-light);
    }
    .shortcut-row:last-child { border-bottom: none; }
    .shortcut-keys { display: flex; align-items: center; }
    .shortcut-then {
      margin: 0 4px;
      color: var(--color-text-muted);
      font-size: 12px;
    }
    .shortcut-desc {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    /* ── Global search overlay ── */
    .search-overlay {
      position: fixed; inset: 0;
      z-index: 500;
      display: flex; align-items: flex-start;
      justify-content: center;
      padding-top: 15vh;
    }
    .search-overlay.hidden { display: none; }
    .search-backdrop {
      position: absolute; inset: 0;
      background: rgba(28,20,16,0.5);
      backdrop-filter: blur(4px);
    }
    .search-box {
      position: relative; z-index: 1;
      width: 560px; max-width: 90vw;
      background: var(--color-surface);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(28,20,16,0.2);
      overflow: hidden;
      border: 1px solid var(--color-border);
    }
    .search-input-wrap {
      display: flex; align-items: center;
      gap: 12px; padding: 14px 18px;
      border-bottom: 1px solid var(--color-border);
    }
    .search-icon {
      width: 18px; height: 18px;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }
    #search-input {
      flex: 1; border: none; outline: none;
      font-size: 16px; background: none;
      color: var(--color-text-primary);
      font-family: inherit;
    }
    #search-input::placeholder {
      color: var(--color-text-muted);
    }
    .search-esc {
      font-size: 11px; padding: 2px 6px;
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      color: var(--color-text-muted);
    }
    .search-results {
      max-height: 360px; overflow-y: auto;
      padding: 8px 0;
    }
    .search-results-header {
      padding: 8px 18px 4px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--color-text-muted);
    }
    .search-result-item {
      display: flex; align-items: center;
      gap: 12px; padding: 8px 18px;
      cursor: pointer;
      transition: background 120ms;
    }
    .search-result-item:hover,
    .search-result-item.focused {
      background: var(--color-surface-alt);
    }
    .search-result-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--color-accent-dim);
      display: flex; align-items: center;
      justify-content: center;
      flex-shrink: 0; font-size: 14px;
    }
    .search-result-title {
      font-size: 14px; font-weight: 500;
      color: var(--color-text-primary);
    }
    .search-result-sub {
      font-size: 12px;
      color: var(--color-text-muted);
    }
    .search-empty {
      padding: 24px; text-align: center;
      color: var(--color-text-muted);
      font-size: 14px;
    }
    .search-trigger {
      background: none; border: 1px solid var(--color-border);
      color: var(--color-text-muted);
      cursor: pointer; padding: 6px 8px;
      border-radius: 6px;
      display: inline-flex; align-items: center;
      gap: 6px; font-size: 12px; font-weight: 500;
      transition: all 120ms;
      font-family: inherit;
    }
    .search-trigger:hover {
      color: var(--color-accent);
      border-color: var(--color-accent);
    }
    .search-trigger svg { width: 14px; height: 14px; }

    /* ── Empty state extensions ── */
    .empty-icon {
      font-size: 36px; margin-bottom: 12px;
      opacity: 0.6;
    }
    .empty-title {
      font-size: 16px; font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }
    .empty-desc {
      font-size: 13px; color: var(--color-text-muted);
      max-width: 320px; margin: 0 auto 20px;
      line-height: 1.5;
    }
    .empty-state-cta {
      padding: 40px 20px;
    }

    /* ── Last updated text ── */
    .last-updated {
      display: inline-flex; align-items: center;
      font-size: 12px;
      color: var(--color-text-muted);
      margin-left: 4px; margin-right: 4px;
    }

    /* ── Section loader ── */
    .section-loader {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.7);
      display: flex; align-items: center;
      justify-content: center;
      border-radius: inherit;
      z-index: 5;
      backdrop-filter: blur(2px);
    }
    :root.dark .section-loader {
      background: rgba(20,18,16,0.7);
    }
    .section-spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* ── Stat delta ── */
    .stat-delta {
      display: block; font-size: 11px;
      margin-top: 4px; font-weight: 500;
    }
    .stat-delta.positive { color: var(--color-success); }
    .stat-delta.negative { color: var(--color-danger); }
    .stat-delta.neutral { color: var(--color-text-muted); }

    /* ── Inline edit ── */
    .inline-edit-input {
      border: none; outline: none;
      border-bottom: 2px solid var(--color-accent);
      background: transparent;
      font-size: inherit; font-family: inherit;
      font-weight: inherit; color: inherit;
      padding: 0;
    }
    .staff-name[data-editable] { cursor: text; }
    .staff-name[data-editable]:hover {
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-color: var(--color-text-muted);
    }

    /* ── Onboarding checklist ── */
    .onboarding-card {
      background: linear-gradient(135deg,
        var(--color-accent-dim),
        var(--color-surface));
      border: 1px solid var(--color-accent);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .onboarding-header {
      display: flex; align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .onboarding-title {
      font-size: 16px; font-weight: 700;
      color: var(--color-text-primary);
    }
    .onboarding-sub {
      font-size: 13px; color: var(--color-text-muted);
      margin-top: 2px;
    }
    .onboarding-dismiss {
      background: none; border: none;
      color: var(--color-text-muted);
      cursor: pointer; font-size: 18px;
      padding: 0 4px;
    }
    .onboarding-dismiss:hover { color: var(--color-text-primary); }
    .onboarding-progress {
      height: 4px; background: var(--color-border);
      border-radius: 2px; overflow: hidden;
      margin-bottom: 14px;
    }
    .onboarding-bar {
      height: 100%; background: var(--color-accent);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .onboarding-steps {
      display: flex; flex-direction: column; gap: 6px;
    }
    .onboarding-step {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      font-size: 14px;
      color: var(--color-text-secondary);
      transition: background 120ms;
    }
    .onboarding-step:not(.done) { cursor: pointer; }
    .onboarding-step:not(.done):hover {
      background: rgba(217,95,43,0.08);
    }
    .onboarding-step.done {
      color: var(--color-text-muted);
      text-decoration: line-through;
    }
    .step-check {
      width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center;
      justify-content: center; flex-shrink: 0;
      font-size: 11px; font-weight: 700;
      border: 1.5px solid var(--color-border);
    }
    .onboarding-step.done .step-check {
      background: var(--color-success);
      border-color: var(--color-success);
      color: white;
    }
    .step-arrow {
      margin-left: auto;
      color: var(--color-accent);
      font-size: 12px;
    }

    /* ── Quick actions ── */
    .quick-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .quick-action-btn {
      display: inline-flex; align-items: center;
      gap: 6px; padding: 8px 14px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: var(--color-surface);
      font-size: 13px; font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 120ms;
      font-family: inherit;
    }
    .quick-action-btn:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
      background: var(--color-accent-dim);
    }
    .quick-action-btn.urgent {
      border-color: var(--color-danger);
      color: var(--color-danger);
      background: var(--color-danger-dim);
      animation: pulse-urgent 2s ease infinite;
    }
    @keyframes pulse-urgent {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* ── Settings subnav ── */
    .settings-subnav {
      display: flex; gap: 4px; flex-wrap: wrap;
      margin-bottom: 20px; padding: 4px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      position: sticky; top: 0; z-index: 20;
    }
    .settings-subnav button {
      padding: 6px 14px; border: none;
      border-radius: 7px; background: none;
      font-size: 13px; cursor: pointer;
      color: var(--color-text-muted);
      font-family: inherit; font-weight: 500;
      transition: all 120ms;
    }
    .settings-subnav button:hover {
      background: var(--color-surface-alt);
      color: var(--color-text-primary);
    }
    .settings-subnav button.active {
      background: var(--color-accent);
      color: white;
    }

    /* ── Sticky table headers (schedule + data tables in scroll containers) ── */
    .schedule-table thead th,
    .data-table thead th {
      position: sticky; top: 0; z-index: 10;
      background: var(--color-surface-alt);
    }
    .schedule-scroll {
      max-height: calc(100vh - 320px);
      overflow-y: auto;
      overflow-x: auto;
    }

    /* ── Page slide animations (mobile swipe) ── */
    @keyframes slide-in-right {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0);   opacity: 1; }
    }
    @keyframes slide-in-left {
      from { transform: translateX(-20px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .page-slide-right { animation: slide-in-right 200ms ease forwards; }
    .page-slide-left  { animation: slide-in-left  200ms ease forwards; }

    /* ── Shift-centric schedule layout ── */
    .shifts-day-group { margin-bottom: 24px; }
    .day-header {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 18px; font-weight: 400;
      color: var(--color-text-primary);
      margin: 16px 0 8px;
      display: flex; align-items: baseline; gap: 10px;
    }
    .day-header-date {
      font-size: 13px; font-weight: 400;
      color: var(--color-text-muted);
      font-family: 'DM Sans', sans-serif;
    }
    .shift-row {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 120ms;
    }
    .shift-row:hover { border-color: var(--color-border-light); }
    .shift-row-header {
      min-width: 160px; flex-shrink: 0;
    }
    .shift-row-name {
      font-weight: 600; font-size: 14px;
      color: var(--color-text-primary);
    }
    .shift-row-time {
      font-size: 12px; color: var(--color-text-muted);
      margin-top: 2px;
    }
    .shift-row-staff {
      flex: 1; display: flex; flex-wrap: wrap;
      gap: 6px; align-items: center;
      min-height: 38px; padding: 4px;
      border-radius: 6px;
      transition: background 120ms, outline-color 120ms;
    }
    .shift-row-staff.drop-target-valid {
      background: var(--color-success-dim);
      outline: 2px dashed var(--color-success);
      outline-offset: -2px;
    }
    .shift-row-staff.drop-target-invalid {
      background: var(--color-danger-dim);
      outline: 2px dashed var(--color-danger);
      outline-offset: -2px;
    }
    .shift-row-empty {
      font-size: 12px; color: var(--color-text-muted);
      font-style: italic; padding: 0 4px;
    }
    .staff-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px 3px 4px;
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: 18px;
      font-size: 13px; font-weight: 500;
      color: var(--color-text-primary);
      position: relative;
      user-select: none;
      transition: border-color 120ms, transform 120ms;
    }
    .staff-pill[draggable="true"] { cursor: grab; }
    .staff-pill[draggable="true"]:active { cursor: grabbing; }
    .staff-pill[draggable="true"]:hover { border-color: var(--color-accent); }
    .staff-pill.dragging { opacity: 0.4; }
    .staff-pill .pill-remove {
      display: none;
      width: 16px; height: 16px; line-height: 16px;
      text-align: center; border-radius: 50%;
      background: var(--color-danger); color: #fff;
      font-size: 11px; font-weight: 700;
      cursor: pointer; margin-left: 2px;
    }
    .staff-pill:hover .pill-remove { display: inline-block; }
    .add-staff-btn {
      background: none;
      border: 1px dashed var(--color-border);
      color: var(--color-text-muted);
      cursor: pointer; padding: 4px 12px;
      border-radius: 14px; font-size: 12px;
      font-family: inherit; font-weight: 500;
      transition: all 120ms;
    }
    .add-staff-btn:hover {
      border-color: var(--color-accent);
      border-style: solid;
      color: var(--color-accent);
      background: var(--color-accent-dim);
    }
    .pick-staff-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 320px; overflow-y: auto;
    }
    .pick-staff-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer;
      transition: background 120ms;
    }
    .pick-staff-row:hover { background: var(--color-surface-alt); }
    .pick-staff-empty {
      padding: 16px; text-align: center;
      color: var(--color-text-muted);
      font-size: 13px;
    }

    /* Sidebar shortcuts hint button */
    .shortcuts-btn {
      background: none; border: none;
      color: var(--color-sidebar-text);
      cursor: pointer; padding: 6px 12px;
      font-size: 12px;
      display: flex; align-items: center; gap: 8px;
      width: 100%; font-family: inherit;
      transition: color 0.15s;
    }
    .shortcuts-btn:hover { color: #fff; }
    .shortcuts-btn .kbd {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      color: var(--color-sidebar-text);
    }

    /* Schedule status banner */
    .schedule-status {
      display: inline-flex; align-items: center;
      gap: 8px; padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 13px; font-weight: 600;
      margin-bottom: 16px;
    }
    .schedule-status.published { background: var(--color-success-dim); color: var(--color-success-text); }
    .schedule-status.draft     { background: var(--color-warning-dim); color: var(--color-warning-text); }
    .schedule-status.empty     { background: var(--color-surface-alt); color: var(--color-text-muted); }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: currentColor; flex-shrink: 0;
    }
    .status-time { font-weight: 400; opacity: 0.75; font-size: 12px; }

    /* OT badge */
    .ot-badge {
      display: inline-block; padding: 1px 5px;
      background: var(--color-danger-dim); color: var(--color-danger);
      font-size: 10px; font-weight: 700;
      border-radius: 3px; margin-left: 4px;
      vertical-align: middle;
    }

    /* Drag/drop */
    .draggable-pill { cursor: grab; position: relative; }
    .draggable-pill:active { cursor: grabbing; }
    .draggable-pill.dragging { opacity: 0.4; cursor: grabbing; }
    .pill-remove {
      display: none; position: absolute;
      top: -6px; right: -6px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--color-danger); color: #fff;
      font-size: 11px; line-height: 16px;
      text-align: center; cursor: pointer;
      font-weight: 700; user-select: none;
    }
    .draggable-pill:hover .pill-remove { display: block; }
    .schedule-cell { transition: background var(--transition-fast); }
    .schedule-cell.droppable { cursor: copy; }
    .drop-target-valid {
      background: var(--color-success-dim) !important;
      outline: 2px dashed var(--color-success);
      outline-offset: -2px;
    }
    .drop-target-invalid {
      background: var(--color-danger-dim) !important;
      outline: 2px dashed var(--color-danger);
      outline-offset: -2px;
    }

    /* Undo toast */
    .undo-toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      background: var(--color-text-primary); color: #fff;
      padding: 12px 20px; border-radius: 8px;
      display: flex; align-items: center;
      gap: 16px; font-size: 14px;
      z-index: 999; min-width: 260px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    .undo-toast button {
      background: none; border: 1px solid rgba(255,255,255,0.4);
      color: #fff; padding: 4px 12px; border-radius: 4px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      white-space: nowrap;
    }
    .undo-toast button:hover { background: rgba(255,255,255,0.15); }
    .undo-timer {
      position: absolute; bottom: 0; left: 0;
      height: 3px; width: 100%;
      background: var(--color-accent);
      border-radius: 0 0 8px 8px;
    }

    /* Confirm-modal backdrop (class form so we can have multiple modals) */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(28,20,16,.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }

    /* Warning button (used for Regenerate when published) */
    .btn-warning {
      background: var(--color-warning-dim);
      color: var(--color-warning-text);
      border: 1px solid var(--color-warning);
      padding: 10px 20px; border-radius: 8px;
      font-weight: 600; cursor: pointer; font-size: 14px;
      font-family: inherit;
      transition: background var(--transition-fast);
    }
    .btn-warning:hover { background: var(--color-warning); color: #fff; }

    .settings-section-title {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted); margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--surface-border);
    }
    .setting-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--surface-alt); gap: 16px;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 14px; font-weight: 500; color: var(--text); }
    .setting-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .setting-input {
      padding: 6px 10px; border: 1px solid var(--surface-border);
      border-radius: 6px; font-size: 14px; width: 180px;
      background: var(--bg); color: var(--text); font-family: inherit;
      transition: border-color var(--transition-fast);
    }
    .setting-input:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px var(--color-accent-dim);
    }
    .setting-save-btn {
      margin-top: 12px; padding: 8px 20px;
      background: var(--accent); color: white;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .setting-save-btn:hover { background: var(--accent-hover); }
    .setting-save-btn.danger { background: var(--color-danger); }
    .setting-save-btn.ghost { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent); }
    .setting-save-btn.ghost:hover { background: var(--accent); color: white; }
    .toggle {
      width: 44px; height: 24px;
      background: var(--surface-border); border-radius: 12px;
      position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--success); }
    .toggle::after {
      content: ''; width: 18px; height: 18px;
      background: var(--color-text-inverse); border-radius: 9px;
      position: absolute; top: 3px; left: 3px; transition: left 0.2s;
    }
    .toggle.on::after { left: 23px; }
    .revenue-type-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3, 12px) 0;
      border-bottom: 1px solid var(--color-border-light, var(--surface-border));
    }
    .revenue-type-row:last-child { border-bottom: none; }
    .type-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-primary, var(--text));
    }
    .empty-state-inline {
      padding: var(--space-4, 16px) 0;
      color: var(--color-text-muted, var(--text-muted));
      font-size: 13px;
    }
  </style>
</head>

            <polyline points="6,9 10,13 6,17" stroke="#D95F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>

          <span class="nav-item-label">Payroll</span>

        <a class="nav-item" data-page="income" onclick="navigateTo('income')">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

      <div class="sidebar-bottom">

          <span>Shortcuts</span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Log out</span>
