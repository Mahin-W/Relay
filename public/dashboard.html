<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="relay-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── New design tokens ── */
      --color-bg:           #FAF7F2;
      --color-surface:      #FFFFFF;
      --color-surface-alt:  #F4EFE6;
      --color-border:       #E8DFD0;
      --color-border-light: #F0E8DC;
      --color-accent:       #D95F2B;
      --color-accent-hover: #C4511F;
      --color-accent-dim:   #FDF0E8;
      --color-accent-text:  #8B3A16;
      --color-text-primary: #1C1410;
      --color-text-secondary:#4A3F35;
      --color-text-muted:   #9A8880;
      --color-text-inverse: #FFFFFF;
      --color-success:      #2D7D5A;
      --color-success-dim:  #E6F4ED;
      --color-success-text: #1A5C3E;
      --color-warning:      #D97706;
      --color-warning-dim:  #FEF3C7;
      --color-warning-text: #92400E;
      --color-danger:       #DC2626;
      --color-danger-dim:   #FEE2E2;
      --color-danger-text:  #991B1B;
      --color-sidebar-bg:   #1C1410;
      --color-sidebar-text: #9A8880;
      --color-sidebar-hover:#2D2520;
      --color-sidebar-active-bg: rgba(217,95,43,0.15);
      --color-sidebar-active:    #D95F2B;
      --color-sidebar-border: rgba(255,255,255,0.06);
      /* Spacing */
      --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
      --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
      /* Radius */
      --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px; --radius-full:9999px;
      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(28,20,16,0.06), 0 1px 2px rgba(28,20,16,0.04);
      --shadow-md: 0 4px 12px rgba(28,20,16,0.08), 0 2px 4px rgba(28,20,16,0.04);
      --shadow-lg: 0 8px 24px rgba(28,20,16,0.10), 0 4px 8px rgba(28,20,16,0.06);
      --shadow-accent: 0 4px 16px rgba(217,95,43,0.25);
      /* Transitions */
      --transition-fast: 120ms ease;
      --transition-base: 200ms ease;
      --transition-slow: 350ms ease;
      /* ── Backward-compat aliases for inline styles ── */
      --bg: var(--color-bg);
      --surface: var(--color-surface);
      --surface-alt: var(--color-surface-alt);
      --surface-border: var(--color-border);
      --text: var(--color-text-primary);
      --text-secondary: var(--color-text-secondary);
      --text-muted: var(--color-text-muted);
      --accent: var(--color-accent);
      --accent-hover: var(--color-accent-hover);
      --accent-light: var(--color-accent-dim);
      --success: var(--color-success);
      --success-light: var(--color-success-dim);
      --sidebar-bg: var(--color-sidebar-bg);
      --sidebar-text: var(--color-sidebar-text);
      --sidebar-text-hover: rgba(250,247,242,0.8);
      --sidebar-text-active: var(--color-sidebar-active);
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: var(--sidebar-bg);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      transition: width 0.2s ease;
    }

    .sidebar-brand {
      padding: 24px 20px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-brand-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
    }

    .sidebar-brand-name {
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      line-height: 1.2;
    }

    .sidebar-brand-restaurant {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.3;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: var(--sidebar-text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .nav-item:hover {
      color: var(--sidebar-text-hover);
    }

    .nav-item.active {
      color: var(--sidebar-text-active);
      border-left-color: var(--sidebar-text-active);
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .nav-item-label {
      white-space: nowrap;
    }

    .sidebar-bottom {
      padding: 16px 20px;
      border-top: 1px solid rgba(250,247,242,0.08);
    }

    .logout-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      color: rgba(250,247,242,0.4);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 6px 0;
      transition: color 0.15s;
    }

    .logout-btn:hover {
      color: rgba(250,247,242,0.7);
    }

    .logout-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── Main Content ── */
    .main-content {
      flex: 1;
      margin-left: 220px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: margin-left 0.2s ease;
    }

    .top-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-bar h2 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--text);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .week-label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .refresh-btn svg {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
    }

    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .content-area {
      flex: 1;
      padding: 24px;
    }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--surface-border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--text);
      line-height: 1.1;
    }

    .stat-sub {
      font-size: 12px;
      margin-top: 6px;
    }

    .stat-sub.green { color: var(--success); }
    .stat-sub.orange { color: var(--accent); }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--surface-border);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .card-body {
      padding: 16px 20px;
    }

    /* ── Schedule Table ── */
    .schedule-wrapper {
      margin-bottom: 24px;
    }

    .schedule-wrapper.compact .schedule-scroll {
      max-height: 280px;
      overflow-y: auto;
    }

    .schedule-scroll {
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .schedule-table thead {
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .schedule-table th {
      background: var(--surface-alt);
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      border-bottom: 1px solid var(--surface-border);
      white-space: nowrap;
    }

    .schedule-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--surface-border);
      vertical-align: top;
    }

    .schedule-table tbody tr:last-child td {
      border-bottom: none;
    }

    .staff-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    .staff-role {
      font-size: 11px;
      color: var(--text-muted);
    }

    .shift-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      margin: 1px 0;
    }

    .shift-pill.lunch  { background: var(--color-accent-dim);  color: var(--color-accent-text); }
    .shift-pill.dinner { background: rgba(217,95,43,0.1);      color: var(--color-accent-text); }
    .shift-pill.brunch { background: var(--color-success-dim); color: var(--color-success-text); }
    .shift-pill.other  { background: var(--color-surface-alt); color: var(--color-text-secondary); }

    .hours-total {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }

    /* ── Two panels ── */
    .panels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Activity / Insights ── */
    .event-list, .insight-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .event-item, .insight-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      line-height: 1.4;
    }

    .event-dot, .insight-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .dot-orange { background: var(--accent); }
    .dot-green { background: var(--success); }
    .dot-yellow { background: #E5A100; }
    .dot-blue { background: #229ED9; }
    .dot-gray { background: var(--text-muted); }

    .event-text { flex: 1; color: var(--text-secondary); }
    .event-time { font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

    .insight-text { flex: 1; color: var(--text-secondary); }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .empty-state svg {
      margin-bottom: 8px;
    }

    .empty-state.green { color: var(--success); }

    /* ── Schedule Nav ── */
    .schedule-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-border);
    }

    .schedule-nav-btn {
      background: none;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .schedule-nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .schedule-nav-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      min-width: 160px;
      text-align: center;
    }

    /* ── Placeholder pages ── */
    .placeholder-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }

    .placeholder-card {
      max-width: 400px;
      padding: 48px;
      text-align: center;
      background: var(--surface);
      border-radius: 10px;
      border: 1px solid var(--surface-border);
    }

    .placeholder-card svg {
      width: 48px;
      height: 48px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .placeholder-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .placeholder-card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ── Skeleton ── */
    .skeleton {
      background: var(--surface-border);
      border-radius: 4px;
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .skeleton-stat {
      height: 28px;
      width: 80px;
      margin-top: 8px;
    }

    .skeleton-row {
      height: 40px;
      width: 100%;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .skeleton-line {
      height: 14px;
      width: 80%;
      margin-bottom: 12px;
    }

    /* ── Error state ── */
    .error-state {
      text-align: center;
      padding: 32px 16px;
    }

    .error-state p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .retry-btn:hover {
      border-color: var(--accent);
    }

    /* ── Hamburger (mobile) ── */
    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger svg {
      width: 22px;
      height: 22px;
      color: var(--text);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28,20,16,0.5);
      z-index: 90;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
      }

      .sidebar-brand-text,
      .nav-item-label,
      .sidebar-bottom span {
        display: none;
      }

      .sidebar-brand {
        padding: 20px 16px;
        justify-content: center;
      }

      .nav-item {
        padding: 10px 0;
        justify-content: center;
        border-left: none;
        border-right: 3px solid transparent;
      }

      .nav-item.active {
        border-right-color: var(--sidebar-text-active);
        border-left-color: transparent;
      }

      .logout-btn {
        justify-content: center;
      }

      .main-content {
        margin-left: 60px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .panels-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 220px;
        transform: translateX(-220px);
        transition: transform 0.25s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.visible {
        display: block;
      }

      .sidebar-brand-text,
      .nav-item-label,
      .sidebar-bottom span {
        display: unset;
      }

      .nav-item {
        padding: 10px 20px;
        justify-content: flex-start;
        border-left: 3px solid transparent;
        border-right: none;
      }

      .nav-item.active {
        border-left-color: var(--sidebar-text-active);
        border-right-color: transparent;
      }

      .main-content {
        margin-left: 0;
      }

      .hamburger {
        display: block;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }

      .content-area {
        padding: 16px;
      }

      .top-bar {
        padding: 12px 16px;
      }
    }

    /* ── Toast notifications ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      animation: slideUp .2s ease;
      max-width: 360px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .toast-success { background: var(--color-success); color: var(--color-text-inverse); }
    .toast-error   { background: var(--color-danger);  color: var(--color-text-inverse); }
    .toast-warning { background: var(--color-accent);  color: var(--color-text-inverse); }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    /* ── Modal ── */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28,20,16,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: var(--color-surface);
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      border: 1px solid var(--color-border);
    }
    .modal-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      color: var(--color-text-primary);
      margin: 0 0 16px;
    }
    .modal-body {
      color: var(--color-text-secondary);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-body label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
      margin-top: 12px;
    }
    .modal-body input,
    .modal-body select,
    .modal-body textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      background: var(--color-bg);
      color: var(--color-text-primary);
      font-family: inherit;
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .btn-primary {
      background: var(--color-accent);
      color: var(--color-text-inverse);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .btn-primary:hover { background: var(--color-accent-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border);
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--color-text-primary);
      margin: 0;
    }

    /* ── Data table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .data-table th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--color-border);
      font-size: 12px;
      font-weight: 700;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid var(--color-border-light);
      color: var(--color-text-primary);
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: var(--color-bg); }

    /* ── Badges & small buttons ── */
    .role-badge {
      background: var(--color-accent-dim);
      color: var(--color-accent);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.active  { background: var(--color-success-dim);  color: var(--color-success); }
    .status-badge.inactive { background: var(--color-surface-alt); color: var(--color-text-muted); }
    .btn-small {
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      cursor: pointer;
      margin-right: 4px;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
    .btn-small:hover { background: var(--color-border); }
    .btn-danger {
      border-color: var(--color-danger-dim);
      background: var(--color-danger-dim);
      color: var(--color-danger);
    }
    .btn-danger:hover { background: var(--color-danger-dim); filter: brightness(0.95); }
    .clickable-name {
      cursor: pointer;
      font-weight: 600;
      color: var(--color-accent);
    }
    .clickable-name:hover { text-decoration: underline; }

    /* ── Time Clock ── */
    .live-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .live-card {
      background: var(--color-accent-dim);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    /* ── Settings form ── */
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .form-input {
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--color-bg);
      color: var(--color-text-primary);
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }

    /* ── Dark mode palette ── */
    :root.dark {
      --color-bg:            #141210;
      --color-surface:       #1E1A17;
      --color-surface-alt:   #252018;
      --color-border:        #2E2620;
      --color-border-light:  #3A3028;
      --color-text-primary:  #F5F0EB;
      --color-text-secondary:#C4B8B0;
      --color-text-muted:    #7A6E68;
      --color-text-inverse:  #FFFFFF;
      --color-accent-dim:    #2A1A0E;
      --color-accent-text:   #F4A87C;
      --color-success-dim:   #1A3028;
      --color-success-text:  #5BCFA0;
      --color-warning-dim:   #3A2A10;
      --color-warning-text:  #FCD34D;
      --color-danger-dim:    #3A1515;
      --color-danger-text:   #F87171;
      --color-sidebar-bg:    #0E0C0A;
      --color-sidebar-hover: #1A1610;
      /* legacy aliases */
      --bg: #141210; --surface: #1E1A17; --surface-alt: #252018;
      --surface-border: #2E2620; --text: #F5F0EB;
      --text-secondary: #C4B8B0; --text-muted: #7A6E68;
      --accent: #D95F2B; --accent-hover: #C4511F; --accent-light: #2A1A0E;
      --success: #2D7D5A; --success-light: #1A3028; --sidebar-bg: #0E0C0A;
    }
    :root.dark body { background: var(--color-bg); color: var(--color-text-primary); }

    /* ── Warning banner (schedule generate no-availability) ── */
    .warning-banner {
      display: flex; align-items: center; gap: 10px;
      background: var(--color-warning-dim); border: 1px solid var(--color-warning);
      border-radius: 8px; padding: 12px 16px;
      margin-bottom: 16px; font-size: 14px; color: var(--color-warning-text);
    }
    :root.dark .warning-banner { background: #3A2A10; color: #FCD34D; border-color: #92400E; }
    .warning-banner button {
      margin-left: auto; background: none; border: none;
      cursor: pointer; color: inherit; font-size: 16px;
    }

    /* ── Daily revenue grid ── */
    .revenue-section { margin-top: 24px; }
    .revenue-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 16px;
    }
    .week-total { font-weight: 700; font-size: 18px; color: var(--text); }
    .revenue-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    }
    .revenue-day {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 8px; padding: 12px; min-height: 170px;
      display: flex; flex-direction: column;
    }
    .day-label {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .day-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .day-total { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .day-entries { flex: 1; overflow-y: auto; max-height: 110px; margin-bottom: 8px; }
    .revenue-entry {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--surface-alt);
    }
    .entry-amount { font-weight: 600; color: var(--text); }
    .entry-note {
      color: var(--text-muted); flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-size: 11px;
    }
    .entry-delete {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; padding: 0 2px; font-size: 11px;
    }
    .entry-delete:hover { color: var(--color-danger); }
    .add-entry { margin-top: auto; }
    .revenue-input, .note-input {
      width: 100%; padding: 4px 6px;
      border: 1px solid var(--surface-border); border-radius: 4px;
      font-size: 12px; margin-bottom: 4px; background: var(--bg); color: var(--text);
      font-family: inherit;
    }
    .note-input { font-size: 11px; color: var(--text); }
    .add-btn {
      width: 100%; padding: 4px;
      background: var(--accent-light); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--accent);
      font-size: 11px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .add-btn:hover { background: var(--accent); color: white; }

    /* ── Revenue bar chart ── */
    .revenue-chart { margin-top: 24px; padding: 16px 0; }
    .chart-bars {
      display: flex; gap: 8px; align-items: flex-end;
      height: 140px; padding-bottom: 4px;
      border-bottom: 1px solid var(--surface-border);
    }
    .chart-col {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; height: 100%;
    }
    .bar-container { flex: 1; width: 100%; display: flex; align-items: flex-end; }
    .bar-fill {
      width: 100%; border-radius: 4px 4px 0 0;
      min-height: 2px; transition: height 0.3s ease;
      background: var(--accent);
    }
    .bar-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .bar-amount { font-size: 10px; color: var(--text-secondary); font-weight: 600; }

    /* Stacked-bar segments (colored by category) */
    .bar-segment {
      width: 100%;
      min-height: 1px;
    }
    .bar-segment:first-child { border-radius: 4px 4px 0 0; }
    .bar-segment:last-child { border-radius: 0; }
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-bottom: 8px; font-size: 12px; color: var(--text-secondary);
    }
    .legend-item {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .category-dot {
      display: inline-block;
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Responsive revenue grid ── */
    @media (max-width: 900px) {
      .revenue-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 600px) {
      .revenue-grid { grid-template-columns: 1fr 1fr; }
    }

    /* ── Time clock table ── */
    .timeclock-table { width: 100%; border-collapse: collapse; }
    .timeclock-table th {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted);
      padding: 8px 12px; text-align: left;
      border-bottom: 2px solid var(--surface-border); background: var(--surface-alt);
    }
    .timeclock-table td {
      padding: 12px; border-bottom: 1px solid var(--surface-border);
      font-size: 14px; vertical-align: middle; color: var(--text);
    }
    .timeclock-table tr.expandable { cursor: pointer; }
    .timeclock-table tr.expandable:hover td { background: var(--surface-alt); }
    .row-warning td { border-left: 3px solid var(--color-warning); }
    .clock-entries-row td { background: var(--surface-alt); padding: 12px 24px; }
    .clock-entries-row.hidden { display: none; }
    .clock-entry {
      display: flex; gap: 16px; align-items: center;
      padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--surface-border);
      color: var(--text-secondary);
    }
    .clock-entry:last-child { border-bottom: none; }
    .text-warning { color: var(--color-accent); font-weight: 600; }
    .text-success { color: var(--success); font-weight: 600; }

    /* ── Alert banner ── */
    .alert-banner {
      border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .alert-banner.orange { background: var(--color-warning-dim); border: 1px solid var(--color-warning); color: var(--color-warning-text); }
    :root.dark .alert-banner.orange { background: #3A2A10; color: #FCD34D; }
    .alert-row { display: flex; align-items: center; gap: 8px; }
    .alert-action {
      margin-left: auto; padding: 4px 12px;
      background: var(--color-surface); color: var(--color-warning-text);
      border: 1px solid var(--color-warning); border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .alert-action:hover { background: var(--color-warning-dim); filter: brightness(0.96); }

    /* ── Event log ── */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-tab {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid var(--surface-border);
      background: var(--surface); font-size: 13px;
      cursor: pointer; color: var(--text-secondary);
      font-family: inherit;
    }
    .filter-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .event-card {
      display: flex; gap: 16px; align-items: flex-start;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 16px; margin-bottom: 12px;
    }
    .event-card.coverage  { border-left: 3px solid var(--color-accent); }
    .event-card.trade     { border-left: 3px solid var(--color-success); }
    .event-card.overtime  { border-left: 3px solid var(--color-warning); }
    .event-icon { font-size: 20px; flex-shrink: 0; }
    .event-body { flex: 1; }
    .event-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .event-meta { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .event-time { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge.green  { background: var(--success-light); color: var(--success); }
    .badge.red    { background: var(--color-danger-dim);  color: var(--color-danger-text); }
    .badge.orange { background: var(--color-warning-dim); color: var(--color-warning-text); }
    .badge.grey   { background: var(--surface-alt); color: var(--text-muted); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 12px; color: var(--text-secondary);
    }
    .empty-state .empty-icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state h3 { margin-bottom: 4px; color: var(--text); }

    /* ── Settings sections ── */
    .settings-section {
      background: var(--surface); border: 1px solid var(--surface-border);
      border-radius: 10px; padding: 20px; margin-bottom: 16px;
    }
    .settings-section-title {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--text-muted); margin-bottom: 16px;
      padding-bottom: 12px; border-bottom: 1px solid var(--surface-border);
    }
    .setting-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--surface-alt); gap: 16px;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 14px; font-weight: 500; color: var(--text); }
    .setting-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .setting-input {
      padding: 6px 10px; border: 1px solid var(--surface-border);
      border-radius: 6px; font-size: 14px; width: 180px;
      background: var(--bg); color: var(--text); font-family: inherit;
    }
    .setting-save-btn {
      margin-top: 12px; padding: 8px 20px;
      background: var(--accent); color: white;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .setting-save-btn:hover { background: var(--accent-hover); }
    .setting-save-btn.danger { background: var(--color-danger); }
    .setting-save-btn.ghost { background: var(--accent-light); color: var(--accent); border: 1px solid var(--accent); }
    .setting-save-btn.ghost:hover { background: var(--accent); color: white; }
    .toggle {
      width: 44px; height: 24px;
      background: var(--surface-border); border-radius: 12px;
      position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
    }
    .toggle.on { background: var(--success); }
    .toggle::after {
      content: ''; width: 18px; height: 18px;
      background: var(--color-text-inverse); border-radius: 9px;
      position: absolute; top: 3px; left: 3px; transition: left 0.2s;
    }
    .toggle.on::after { left: 23px; }
  </style>
</head>

  <script>
    // ── State ──
    let currentPage = 'overview';
    let currentScheduleWeek = getCurrentWeekStart();
    let dashboardData = {};
    let refreshInterval = null;

    const PAGE_TITLES = {
      overview: 'Overview',
      schedule: 'Schedule',
      staff: 'Staff',
      payroll: 'Payroll',
      timeclock: 'Time Clock',
      eventlog: 'Event Log',
      settings: 'Settings'
    };

    // ── Helpers ──
    function getCurrentWeekStart() {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diff);
      return formatDate(monday);
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatWeekRange(weekStartStr) {
      const start = parseDate(weekStartStr);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const startMonth = months[start.getMonth()];
      const endMonth = months[end.getMonth()];
      if (startMonth === endMonth) {
        return `${startMonth} ${start.getDate()} \u2013 ${end.getDate()}`;
      }
      return `${startMonth} ${start.getDate()} \u2013 ${endMonth} ${end.getDate()}`;
    }

    function relativeTime(timestamp) {
      if (!timestamp) return '';
      const now = Date.now();
      const then = new Date(timestamp).getTime();
      const diff = now - then;
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (seconds < 60) return 'just now';
      if (minutes < 60) return `${minutes}min ago`;
      if (hours < 24) return `${hours}hr ago`;
      if (days === 1) return 'Yesterday';
      if (days < 7) return `${days} days ago`;
      return new Date(timestamp).toLocaleDateString();
    }

    function shiftPillClass(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('lunch')) return 'lunch';
      if (n.includes('dinner')) return 'dinner';
      if (n.includes('brunch')) return 'brunch';
      return 'other';
    }

    function eventDotClass(type) {
      switch (type) {
        case 'callout': return 'dot-orange';
        case 'coverage_filled': return 'dot-green';
        case 'late': return 'dot-yellow';
        case 'recognition': return 'dot-blue';
        default: return 'dot-gray';
      }
    }

    function insightDotClass(type) {
      switch (type) {
        case 'good': return 'dot-green';
        case 'warning': return 'dot-orange';
        default: return 'dot-gray';
      }
    }

    function formatCurrency(n) {
      return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    // ── API ──
    async function apiFetch(url) {
      const res = await fetch(url, { credentials: 'include' });
      if (res.status === 401) {
        window.location.href = '/login';
        throw new Error('Unauthorized');
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function api(path, method = 'GET', body = null) {
      const opts = { method, credentials: 'include', headers: {} };
      if (body) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      if (res.status === 401) {
        window.location.href = '/login';
        return null;
      }
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        throw new Error(e.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    // ── Toast ──
    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    // ── Modal ──
    function showModal(title, bodyHTML, onConfirm, confirmLabel = 'Confirm') {
      const existing = document.getElementById('modal-backdrop');
      if (existing) existing.remove();
      const m = document.createElement('div');
      m.id = 'modal-backdrop';
      m.innerHTML = `
        <div class="modal-card">
          <h3 class="modal-title"></h3>
          <div class="modal-body">${bodyHTML}</div>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="document.getElementById('modal-backdrop').remove()">Cancel</button>
            <button class="btn-primary" id="modal-confirm">${confirmLabel}</button>
          </div>
        </div>`;
      document.body.appendChild(m);
      document.querySelector('#modal-backdrop .modal-title').textContent = title;
      document.getElementById('modal-confirm').onclick = () => { m.remove(); onConfirm(); };
      m.addEventListener('click', e => { if (e.target === m) m.remove(); });
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') { m.remove(); document.removeEventListener('keydown', esc); }
      });
    }

        ? `<span class="stat-sub ${d.revenuePercent > 30 ? 'orange' : 'green'}">${d.revenuePercent}% of revenue</span>`
        : `<span class="stat-sub orange">Enter revenue for %</span>`;

      return `
        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Staff Scheduled</div>

          </div>
          <div class="stat-card">
            <div class="stat-label">Shifts This Week</div>
            <div class="stat-value">${d.shiftsThisWeek ?? '—'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Coverage Requests</div>
            <div class="stat-value">${d.coverageRequests ?? '0'}</div>
            ${coverageSub}
          </div>
          <div class="stat-card">
            <div class="stat-label">Labor Cost</div>
            <div class="stat-value">${d.laborCost != null ? formatCurrency(d.laborCost) : '—'}</div>
            ${laborSub}
          </div>
        </div>
      `;
    }

    function renderScheduleTable(schedule, compact) {
      const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
      const DAY_FULL = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
      const staff = schedule?.staff || [];
      const showHours = !compact;

      let html = `<div class="card schedule-wrapper${compact ? ' compact' : ''}">`;

      if (!compact) {
        html += `
          <div class="schedule-nav">
            <button class="schedule-nav-btn" onclick="changeScheduleWeek(-7)">&larr; Prev</button>
            <span class="schedule-nav-label">Week of ${formatWeekRange(currentScheduleWeek)}</span>
            <button class="schedule-nav-btn" onclick="changeScheduleWeek(7)">Next &rarr;</button>
          </div>
        `;
      } else {
        html += `<div class="card-header">This Week's Schedule</div>`;
      }

      html += `<div class="schedule-scroll"><table class="schedule-table"><thead><tr>
        <th>Staff</th>`;
      days.forEach(d => { html += `<th>${d}</th>`; });
      if (showHours) html += `<th>Total</th>`;
      html += `</tr></thead><tbody>`;

      if (staff.length === 0) {
        html += `<tr><td colspan="${showHours ? 9 : 8}" style="text-align:center;padding:24px;color:var(--text-muted)">No schedule data</td></tr>`;
      }

      staff.forEach(member => {
        html += `<tr><td><div class="staff-name">${escapeHtml(member.staffName || member.name || '')}</div>`;
        if (member.roleName || member.role) html += `<div class="staff-role">${escapeHtml(member.roleName || member.role)}</div>`;
        html += `</td>`;

        days.forEach(day => {
          const shifts = member.shifts?.[DAY_FULL[day]] || member.shifts?.[day.toLowerCase()] || member.shifts?.[day] || [];
          html += `<td>`;
          if (Array.isArray(shifts)) {
            shifts.forEach(s => {
              const label = typeof s === 'string' ? s : s.shiftName || s.name || '';
              html += `<div class="shift-pill ${shiftPillClass(label)}">${escapeHtml(label)}</div>`;
            });
          }
          html += `</td>`;
        });

        if (showHours) {
          html += `<td><span class="hours-total">${member.totalHours != null ? member.totalHours + 'h' : '—'}</span></td>`;
        }
        html += `</tr>`;
      });

      html += `</tbody></table></div></div>`;
      return html;
    }

    function renderActivity(events) {
      if (!events || events.length === 0) {
        return `<div class="empty-state">No recent activity</div>`;
      }
      let html = '<ul class="event-list">';
      events.forEach(e => {
        html += `
          <li class="event-item">
            <span class="event-dot ${eventDotClass(e.type)}"></span>
            <span class="event-text">${escapeHtml(e.text || e.message || '')}</span>
            <span class="event-time">${relativeTime(e.timestamp || e.created_at)}</span>
          </li>`;
      });
      html += '</ul>';
      return html;
    }

    function renderInsights(insights) {
      if (!insights || insights.length === 0) {
        return `<div class="empty-state green">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2D7D5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div>Everything looks good this week</div>
        </div>`;
      }
      let html = '<ul class="insight-list">';
      insights.forEach(i => {
        html += `
          <li class="insight-item">
            <span class="insight-dot ${insightDotClass(i.type || i.level)}"></span>
            <span class="insight-text">${escapeHtml(i.text || i.message || '')}</span>
          </li>`;
      });
      html += '</ul>';
      return html;
    }

    function renderOverview(data) {
      const { overview, activity, insights, schedule } = data;
      let html = renderStatCards(overview);
      html += renderScheduleTable(schedule, true);
      html += `
        <div class="panels-grid">
          <div class="card">
            <div class="card-header">Recent Activity</div>
            <div class="card-body">${renderActivity(activity?.events || activity)}</div>
          </div>
          <div class="card">
            <div class="card-header">Relay's Insights</div>
            <div class="card-body">${renderInsights(insights?.insights || insights)}</div>
          </div>
        </div>
      `;
      return html;
    }

    function renderSchedulePage(schedule) {
      const weekStart = (schedule && schedule.weekStart) || currentScheduleWeek;
      const actionBar = `
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
          <button class="btn-primary" onclick="generateSchedule(this,'${weekStart}')">&#9889; Generate Schedule</button>
          <button id="approve-btn" class="btn-primary" style="background:var(--color-success)" onclick="approveSchedule('${weekStart}')">
            &#10003; Approve &amp; Publish
          </button>
        </div>`;
      return actionBar + renderScheduleTable(schedule, false);
    }

    async function generateSchedule(btn, weekStart) {
      btn.disabled = true;
      const originalLabel = btn.innerHTML;
      btn.textContent = 'Generating...';
      try {
        const result = await api('/api/schedule/generate', 'POST', { weekStart });
        const warnings = (result && result.warnings) || [];
        // Reload the schedule view first so banners have a container to prepend into
        const schedule = await loadScheduleData(currentScheduleWeek);
        setContent(renderSchedulePage(schedule));
        if (warnings.length > 0) {
          const container = document.getElementById('page-content');
          container.querySelectorAll('.warning-banner').forEach(b => b.remove());
          for (const w of warnings) {
            const banner = document.createElement('div');
            banner.className = 'warning-banner';
            banner.innerHTML = `<span>⚠️</span><span>${escapeHtml(w.message)}</span><button onclick="this.parentElement.remove()" aria-label="Dismiss">✕</button>`;
            container.prepend(banner);
          }
          showToast(`Schedule generated (${warnings.length} warning${warnings.length === 1 ? '' : 's'})`, 'warning');
        } else {
          showToast('Schedule generated');
        }
      } catch (e) {
        showToast(e.message, 'error');
        btn.disabled = false;
        btn.innerHTML = originalLabel;
      }
    }

    async function approveSchedule(weekStart) {
      const btn = document.getElementById('approve-btn');
      btn.disabled = true;
      btn.textContent = 'Publishing...';
      try {
        const r = await api('/api/schedule/approve', 'POST', { weekStart });
        showToast(`Schedule published to Telegram! ${r && r.staffNotified != null ? r.staffNotified : 0} staff notified.`);
        btn.textContent = 'Published ✓';
        btn.style.background = 'var(--color-success-text)';
      } catch (e) {
        showToast(e.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '&#10003; Approve &amp; Publish';
      }
    }

    function renderPlaceholder(name, iconSvg) {
      return `
        <div class="placeholder-page">
          <div class="placeholder-card">
            ${iconSvg}
            <h3>${escapeHtml(name)} coming soon</h3>
            <p>This will be available in a future update.</p>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Navigation ──
    function navigateTo(page) {
      currentPage = page;
      window.location.hash = page;

      // Update active nav
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.page === page);
      });

      document.getElementById('page-title').textContent = PAGE_TITLES[page] || page;

      // Close sidebar on mobile
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('visible');

      loadPage(page);
    }

    async function loadPage(page) {
      const content = document.getElementById('page-content');

      switch (page) {
        case 'overview':
          content.innerHTML = renderOverviewSkeleton();
          try {
            const data = await loadOverviewData();
            content.innerHTML = renderOverview(data);
          } catch {
            content.innerHTML = renderError("loadPage('overview')");
          }
          break;

        case 'schedule':
          content.innerHTML = renderScheduleSkeleton();
          try {
            const schedule = await loadScheduleData(currentScheduleWeek);
            content.innerHTML = renderSchedulePage(schedule);
          } catch {
            content.innerHTML = renderError("loadPage('schedule')");
          }
          break;

        case 'staff':
          showSkeleton();
          loadStaffPage();
          break;

        case 'payroll':
          showSkeleton();
          loadPayrollPage();
          break;

        case 'timeclock':
          showSkeleton();
          loadTimeClockPage();
          break;

        case 'eventlog':
          showSkeleton();
          loadEventLogPage();
          break;

        case 'settings':
          showSkeleton();
          loadSettingsPage();
          break;
      }
    }

    async function changeScheduleWeek(delta) {
      const d = parseDate(currentScheduleWeek);
      d.setDate(d.getDate() + delta);
      currentScheduleWeek = formatDate(d);

      const content = document.getElementById('page-content');
      content.innerHTML = renderScheduleSkeleton();
      try {
        const schedule = await loadScheduleData(currentScheduleWeek);
        content.innerHTML = renderSchedulePage(schedule);
      } catch {
        content.innerHTML = renderError(`changeScheduleWeek(0)`);
      }
    }

    function handleRefresh() {
      const btn = document.getElementById('refresh-btn');
      btn.classList.add('spinning');
      loadPage(currentPage).finally(() => {
        btn.classList.remove('spinning');
      });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('visible');
    }

    async function loadStaffPage() {
      try {
        const staff = await api('/api/staff');
        if (!staff) return;
        renderStaffPage(staff);

        showToast(e.message, 'error');
        renderErrorInline("loadPage('staff')");

    function renderStaffPage(staff) {
      const rows = staff.map(s => `
        <tr>
          <td><span class="clickable-name" onclick="openEditStaff(${s.id},'${escapeJs(s.name)}','${escapeJs(s.role)}')">${escapeHtml(s.name)}</span></td>
          <td><span class="role-badge">${escapeHtml(s.role)}</span></td>
          <td><span class="status-badge ${s.active !== false ? 'active' : 'inactive'}">${s.active !== false ? 'Active' : 'Removed'}</span></td>
          <td>${s.registered ? '✅' : '⏳'}</td>
          <td>
            <button class="btn-small" onclick="openEditStaff(${s.id},'${escapeJs(s.name)}','${escapeJs(s.role)}')">Edit</button>
            <button class="btn-small btn-danger" onclick="confirmRemoveStaff(${s.id},'${escapeJs(s.name)}')">Remove</button>
          </td>
        </tr>`).join('');

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Staff</h2>
          <button class="btn-primary" onclick="openAddStaff()">+ Add Staff</button>
        </div>
        <div class="card">
          <table class="data-table">
            <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Registered</th><th>Actions</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--color-text-muted)">No staff yet</td></tr>'}</tbody>
          </table>
        </div>`);
    }

    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function openAddStaff() {
      showModal('Add Staff Member',
        `<label>Name</label><input id="m-name" placeholder="Full name" />
         <label>Role</label><input id="m-role" placeholder="e.g. Server, Cook" />`,
        async () => {
          const name = document.getElementById('m-name').value.trim();
          const role = document.getElementById('m-role').value.trim();
          if (!name || !role) { showToast('Name and role required', 'error'); return; }
          try {
            await api('/api/staff', 'POST', { name, role });
            showToast(`${name} added`);
            loadStaffPage();
          } catch (e) { showToast(e.message, 'error'); }
        }, 'Add Staff');
    }

    function openEditStaff(id, name, role) {
      showModal(`Edit ${name}`,
        `<label>Name</label><input id="m-name" value="${escapeHtml(name)}" />
         <label>Role</label><input id="m-role" value="${escapeHtml(role)}" />`,
        async () => {
          const newName = document.getElementById('m-name').value.trim();
          const newRole = document.getElementById('m-role').value.trim();
          if (!newName || !newRole) { showToast('Name and role required', 'error'); return; }
          try {
            await api(`/api/staff/${id}`, 'PATCH', { name: newName, role: newRole });
            showToast('Staff updated');
            loadStaffPage();
          } catch (e) { showToast(e.message, 'error'); }
        }, 'Save Changes');
    }

    function confirmRemoveStaff(id, name) {
      showModal(`Remove ${name}?`,
        `<p>This will remove ${escapeHtml(name)} from Relay. Their pay history is kept. The Telegram group will be notified.</p>`,
        async () => {
          try {
            await api(`/api/staff/${id}`, 'DELETE');
            showToast(`${name} removed`);
            loadStaffPage();
          } catch (e) { showToast(e.message, 'error'); }
        }, 'Remove');
    }

    // ───────────────────────────────────────────
    // ── PAGE: PAYROLL ──
    // ───────────────────────────────────────────
    let currentPayrollWeek = getCurrentWeekStart();

    // Revenue category → color + label. Keep in sync with ALLOWED_CATEGORIES in dashRoutes.js.
    const REV_CATEGORIES = {
      lunch:     { label: 'Lunch',     color: '#F5A623' },
      dinner:    { label: 'Dinner',    color: '#4A90E2' },
      brunch:    { label: 'Brunch',    color: '#2D7D5A' },
      breakfast: { label: 'Breakfast', color: '#E8C547' },
      bar:       { label: 'Bar',       color: '#D95F2B' },
      catering:  { label: 'Catering',  color: '#9B59B6' },
      other:     { label: 'Other',     color: '#9A8880' },
    };
    const CATEGORY_ORDER = ['lunch','dinner','brunch','breakfast','bar','catering','other'];
    function categoryColor(cat) { return REV_CATEGORIES[cat]?.color || REV_CATEGORIES.other.color; }
    function categoryLabel(cat) { return REV_CATEGORIES[cat]?.label || 'Other'; }
    function categorySelectOptions(selected) {
      return CATEGORY_ORDER.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${REV_CATEGORIES[c].label}</option>`).join('');
    }

    async function loadPayrollPage() {
      try {
        const [payroll, settings, tips, revenue] = await Promise.all([
          api(`/api/payroll?week=${currentPayrollWeek}`),
          api(`/api/settings`),
          api(`/api/tips?weeks=1`),
          api(`/api/revenue/daily?weekStart=${currentPayrollWeek}`)
        ]);
        renderPayrollPage(payroll || [], settings || {}, tips || [], revenue || {days:{},weekTotal:0});
      } catch (e) {
        showToast(e.message, 'error');
        renderErrorInline("loadPage('payroll')");
      }
    }

    function renderPayrollPage(payroll, settings, tips, revenue) {
      const totalPay = payroll.reduce((s, r) => s + (r.total_gross_pay || 0), 0);
      const totalHrs = payroll.reduce((s, r) => s + (r.total_hours || 0), 0);
      // Sum tips entered this week (shift_date between this week's Mon and Sun)
      const weekEnd = formatDate(new Date(parseDate(currentPayrollWeek).getTime() + 6 * 86400000));
      const weekTipsTotal = (tips || [])
        .filter(t => t.shift_date >= currentPayrollWeek && t.shift_date <= weekEnd)
        .reduce((s, t) => s + Number(t.total_tips || 0), 0);
      const today = formatDate(new Date());
      const isTodayInWeek = today >= currentPayrollWeek && today <= weekEnd;

      const rows = payroll.map(r => `
        <tr>
          <td>${escapeHtml(r.name)}</td>
          <td><span class="role-badge">${escapeHtml(r.role)}</span></td>
          <td>${(r.total_hours || 0).toFixed(1)}</td>
          <td>${formatCurrency(r.total_gross_pay || 0)}</td>
        </tr>`).join('');

      // Disable the Next arrow when we're viewing the current week (don't navigate past)
      const thisWeek = getCurrentWeekStart();
      const atCurrent = currentPayrollWeek >= thisWeek;

      setContent(`
        <div class="page-header">
          <h2 class="page-title">Payroll</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn-small" onclick="changePayrollWeek(-7)">&larr; Prev</button>
            <span style="font-size:14px;font-weight:600;color:var(--text-secondary)">Week of ${formatWeekRange(currentPayrollWeek)}</span>
            <button class="btn-small" onclick="changePayrollWeek(7)" ${atCurrent ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>Next &rarr;</button>
            <a href="/api/payroll/spreadsheet?week=${currentPayrollWeek}" download class="btn-small">📥 Export CSV</a>
          </div>
        </div>

        <div class="stat-grid" style="margin-bottom:20px;grid-template-columns:repeat(4,1fr)">
          <div class="stat-card"><div class="stat-label">Labor Cost</div><div class="stat-value">${formatCurrency(totalPay)}</div></div>
          <div class="stat-card"><div class="stat-label">Total Hours</div><div class="stat-value">${totalHrs.toFixed(1)}h</div></div>
          <div class="stat-card"><div class="stat-label">Week Revenue</div><div class="stat-value">${formatCurrency(revenue.weekTotal || 0)}</div></div>
          <div class="stat-card"><div class="stat-label">Week Tips</div><div class="stat-value">${formatCurrency(weekTipsTotal)}</div></div>
        </div>

        <div class="card" style="margin-bottom:20px;padding:20px">
          <h3 style="margin:0 0 12px;font-size:16px;font-weight:700;color:var(--text)">Log revenue</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">For right now <span style="font-weight:400;text-transform:none">(${today})</span></div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <select id="now-rev-cat" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit">${categorySelectOptions(new Date().getHours() < 15 ? 'lunch' : 'dinner')}</select>
                <input id="now-rev-amount" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;min-width:100px;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
                <button class="btn-primary" onclick="addRevenueNow()">Add now</button>
              </div>
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">For a specific date</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <input id="any-rev-date" type="date" value="${today}" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit">
                <select id="any-rev-cat" style="padding:8px 10px;border:1px solid var(--surface-border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit">${categorySelectOptions('dinner')}</select>
                <input id="any-rev-amount" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;min-width:100px;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
                <button class="btn-primary" onclick="addRevenueAnyDate()">Add</button>
              </div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Tips today</div>
              <div style="display:flex;gap:8px">
                <input id="quick-tips" type="number" min="0" step="0.01" placeholder="Amount $" style="flex:1;padding:8px 12px;border:1px solid var(--surface-border);border-radius:6px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit">
                <button class="btn-primary" onclick="quickAddTips()">Add</button>
              </div>
            </div>
          </div>
