<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Relay</title>
  <link rel="icon" type="image/svg+xml" href="relay-favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #FAF7F2; color: #1C1410; min-height: 100vh; display: flex; flex-direction: column; }
    .nav { padding: 20px 32px; display: flex; align-items: center; gap: 10px; }
    .nav-logo-icon { width: 28px; height: 28px; background: #D95F2B; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-logo-text { font-size: 20px; font-weight: 800; color: #1C1410; letter-spacing: -0.02em; }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .card { max-width: 420px; width: 100%; background: #FFFFFF; border: 1px solid #E8DFD0; border-radius: 16px; padding: 48px; box-shadow: 0 4px 24px rgba(28, 20, 16, 0.06); }
    .card-logo { margin-bottom: 28px; display: flex; justify-content: center; }
    .card h1 { font-size: 26px; font-weight: 800; color: #1C1410; text-align: center; margin-bottom: 8px; }
    .card .subtitle { font-size: 15px; color: #4A3F35; text-align: center; margin-bottom: 28px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    .form-label { display:block; font-size:13px; font-weight:600; color:#4A3F35; margin-bottom:6px; }
    .form-input { width: 100%; padding: 14px 16px; border: 1.5px solid #E8DFD0; border-radius: 8px; font-size: 16px; font-family: inherit; color: #1C1410; background: #FAF7F2; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #D95F2B; }
    .form-input::placeholder { color: #9A8880; }
    .code-input { letter-spacing: 10px; text-align: center; font-size: 24px; font-weight: 700; }
    .btn-primary { background: #D95F2B; color: #FFFFFF; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; font-family: inherit; width: 100%; cursor: pointer; transition: background 0.2s; }
    .btn-primary:hover { background: #B84D20; }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-google { background: #FFFFFF; color: #1C1410; border: 1.5px solid #E8DFD0; padding: 13px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; font-family: inherit; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.15s; }
    .btn-google:hover { background: #FAF7F2; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #9A8880; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #E8DFD0; }
    .hint-text { color: #9A8880; font-size: 13px; text-align: center; margin-top: 16px; line-height: 1.5; }
    .hint-text a { color: #D95F2B; font-weight: 600; text-decoration: none; cursor: pointer; }
    .error-message { display: none; color: #c0392b; font-size: 14px; text-align: center; margin-top: 12px; line-height: 1.4; }
    .error-message.visible { display: block; }
    .ok-message { display: none; color: #2e7d32; font-size: 14px; text-align: center; margin-top: 12px; line-height: 1.4; }
    .ok-message.visible { display: block; }
    .step { display: none; }
    .step.active { display: block; }
    .footer { background: #1C1410; padding: 40px 32px; text-align: center; }
    .footer-brand { font-size: 18px; font-weight: 800; color: #FFFFFF; margin-bottom: 8px; }
    .footer-tagline { font-size: 14px; color: #9A8880; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo" style="text-decoration:none; display:flex; align-items:center; gap:8px; cursor:pointer;">
      <div class="nav-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20">
          <path d="M 7,2.5 L 25,2.5 Q 29,2.5 29,6 L 29,19 Q 29,23 25,23 L 10,23 L 4,28 L 6,23 Q 3,23 3,19 L 3,6 Q 3,2.5 7,2.5 Z" fill="white"/>
          <polyline points="20,9 24,13 20,17" stroke="#D95F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <span class="nav-logo-text">Relay</span>
    </a>
  </nav>

  <main class="main">
    <div class="card">
      <div class="card-logo">
        <div class="nav-logo-icon" style="width:44px;height:44px;border-radius:10px">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
            <path d="M 7,2.5 L 25,2.5 Q 29,2.5 29,6 L 29,19 Q 29,23 25,23 L 10,23 L 4,28 L 6,23 Q 3,23 3,19 L 3,6 Q 3,2.5 7,2.5 Z" fill="white"/>
            <polyline points="20,9 24,13 20,17" stroke="#D95F2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Step 1: Google / email auth -->
      <div id="step-auth" class="step active">
        <h1 id="title">Welcome back</h1>
        <p class="subtitle" id="subtitle">Sign in to your Relay account</p>

        <button type="button" class="btn-google" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-input" id="email" placeholder="you@restaurant.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="button" class="btn-primary" id="submit-btn">Sign in</button>
        <p class="error-message" id="error"></p>
        <p class="ok-message" id="ok"></p>
        <p class="hint-text" id="toggle-hint">New to Relay? <a id="toggle-link">Create an account</a></p>
      </div>

      <!-- Step 2: Login confirmation code (2FA) -->
      <div id="step-code" class="step">
        <h1>Confirm it's you</h1>
        <p class="subtitle" id="code-subtitle">We sent a 6-digit code.</p>
        <input type="text" class="form-input code-input" id="code-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
        <div style="height:12px"></div>
        <button type="button" class="btn-primary" id="verify-btn">Verify</button>
        <p class="error-message" id="code-error"></p>
        <p class="hint-text"><a id="resend-link">Resend code</a> &nbsp;·&nbsp; <a id="signout-link">Use a different account</a></p>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-brand">Relay</div>
    <div class="footer-tagline">Scheduling for restaurants that run on Telegram.</div>
  </footer>

  <script type="module">
    import { getSupabase, getAccessToken, routeAfterAuth, authFetch, setTwoFactorToken, signOut } from './relayAuth.js';

    const $ = id => document.getElementById(id);
    const stepAuth = $('step-auth'), stepCode = $('step-code');
    const title = $('title'), subtitle = $('subtitle'), submitBtn = $('submit-btn'), googleBtn = $('google-btn');
    const emailEl = $('email'), passwordEl = $('password'), errorEl = $('error'), okEl = $('ok');
    const toggleHint = $('toggle-hint');

    let mode = location.pathname === '/signup' ? 'signup' : 'login';

    function showError(el, msg) { el.textContent = msg; el.classList.add('visible'); }
    function clearMsg() { errorEl.classList.remove('visible'); okEl.classList.remove('visible'); }
    function goToCodeStep() { stepAuth.classList.remove('active'); stepCode.classList.add('active'); }

    function applyMode() {
      if (mode === 'signup') {
        title.textContent = 'Create your account';
        subtitle.textContent = 'Get Relay set up for your restaurant';
        submitBtn.textContent = 'Create account';
        passwordEl.autocomplete = 'new-password';
        toggleHint.innerHTML = 'Already have an account? <a id="toggle-link">Sign in</a>';
      } else {
        title.textContent = 'Welcome back';
        subtitle.textContent = 'Sign in to your Relay account';
        submitBtn.textContent = 'Sign in';
        passwordEl.autocomplete = 'current-password';
        toggleHint.innerHTML = 'New to Relay? <a id="toggle-link">Create an account</a>';
      }
      $('toggle-link').addEventListener('click', () => { mode = mode === 'login' ? 'signup' : 'login'; clearMsg(); applyMode(); });
    }

    // ── After Supabase auth: run the login confirmation code if required ──
    async function handleLoginThen2fa() {
      await authFetch('/api/account/bootstrap', { method: 'POST' }).catch(() => {});
      let res;
      try { res = await authFetch('/api/account/2fa/start', { method: 'POST' }); }
      catch { return routeAfterAuth(); }   // if 2FA can't start, don't block sign-in
      if (!res || !res.required) return routeAfterAuth();
      $('code-subtitle').textContent = res.channel === 'telegram'
        ? 'Enter the 6-digit code we sent to your Telegram.'
        : `Enter the 6-digit code we emailed to ${res.hint}.`;
      goToCodeStep();
      $('code-input').focus();
    }

    async function verifyCode() {
      const code = $('code-input').value.trim();
      if (code.length < 6) { showError($('code-error'), 'Enter the 6-digit code.'); return; }
      $('code-error').classList.remove('visible');
      $('verify-btn').disabled = true; $('verify-btn').textContent = 'Verifying…';
      try {
        const r = await authFetch('/api/account/2fa/verify', { method: 'POST', body: { code } });
        setTwoFactorToken(r.token);
        await routeAfterAuth();
      } catch (err) {
        showError($('code-error'), err.message || 'Incorrect code.');
        $('verify-btn').disabled = false; $('verify-btn').textContent = 'Verify';
      }
    }

    // If already signed in, jump straight to the 2FA/route flow.
    (async () => { try { if (await getAccessToken()) await handleLoginThen2fa(); } catch {} })();

    googleBtn.addEventListener('click', async () => {
      clearMsg();
      try {
        const sb = await getSupabase();
        await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + '/login' } });
      } catch (err) { showError(errorEl, err.message || 'Could not start Google sign-in.'); }
    });

    submitBtn.addEventListener('click', async () => {
      clearMsg();
      const email = emailEl.value.trim(), password = passwordEl.value;
      if (!email || !password) { showError(errorEl, 'Enter your email and password.'); return; }
      submitBtn.disabled = true; submitBtn.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';
      try {
        const sb = await getSupabase();
        if (mode === 'signup') {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (!data.session) { okEl.textContent = 'Check your email to confirm your account, then sign in.'; okEl.classList.add('visible'); mode = 'login'; applyMode(); return; }
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
        }
        await handleLoginThen2fa();
      } catch (err) {
        showError(errorEl, err.message || 'Something went wrong — try again.');
      } finally {
        submitBtn.disabled = false; applyMode();
      }
    });

    $('verify-btn').addEventListener('click', verifyCode);
    $('code-input').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); if (e.target.value.length === 6) verifyCode(); });
    $('resend-link').addEventListener('click', () => handleLoginThen2fa());
    $('signout-link').addEventListener('click', () => signOut('/login'));
    passwordEl.addEventListener('keydown', e => { if (e.key === 'Enter') submitBtn.click(); });
    applyMode();
  </script>
</body>
</html>
