services:
  - type: web
    name: relay-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Required after migration 008 (RLS lockdown). Server uses this to bypass
      # per-tenant RLS and rely on app-layer auth. Supabase → Project Settings
      # → API → service_role key.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Account-based dashboard login (Supabase Auth). Supabase → Project
      # Settings → API → JWT Settings → "JWT Secret".
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Bot @username (no @) — used to build Telegram deep links, incl. the
      # account linking code (?start=link_<code>) and add-to-group button.
      - key: BOT_USERNAME
        sync: false
      # Optional — proxy target for the landing-page waitlist form.
      - key: WAITLIST_GAS_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://getrelay-app.netlify.app
      - key: PORT
        value: 10000
    healthCheckPath: /health
